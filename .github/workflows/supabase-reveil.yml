# Réveil automatique de la base Supabase (évite la mise en pause après 7 jours sans activité).
# Tourne tous les 2 jours. Ne fait rien tant que les secrets SUPABASE_URL et SUPABASE_ANON_KEY ne sont pas renseignés.
name: Réveil Supabase

on:
  schedule:
    - cron: "17 5 */2 * *"   # tous les 2 jours à 05:17 UTC
  workflow_dispatch:         # lancement manuel possible depuis l'onglet Actions

jobs:
  reveil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Interroger la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase pas encore configuré : rien à faire."
            exit 0
          fi
          # Lecture d'une ligne de la table « reveil » (requête réelle sur la base)
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/reveil?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Réponse : $code"; cat /tmp/r.txt; echo
          if [ "$code" -ge 400 ]; then
            echo "::warning::La base n'a pas répondu correctement (code $code). Si le projet est en pause, le réactiver dans le tableau de bord Supabase."
            exit 1
          fi
          echo "Base réveillée."
