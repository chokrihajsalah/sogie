<style>
:root{
  --bg:#eef2f8;--card:#fff;--fg:#17233a;--muted:#5b6a83;--line:#d5deeb;
  --brand:#4472c4;--brand-deep:#2f5496;--input:#f7f9fc;--ok:#1f7a4d;--warn:#b3261e;--amber:#9a6400;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--fg:#e6ecf7;--muted:#9aa8c2;--line:#2b3a58;--brand:#5b87d6;--brand-deep:#8fb0ea;--input:#111a2c;--ok:#5cc28f;--warn:#ff8a80;--amber:#f0b44c;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sync{width:12px;height:12px;border-radius:50%;background:#9aa8c2;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.sync.ok{background:#5cc28f}.sync.busy{background:#f0b44c}.sync.off{background:#cfd6e4}.sync.err{background:#ff6b5e}
body.locked nav.tabs,body.locked .side{display:none!important}
@media (min-width:1000px){body.locked{padding-left:0}}
body[data-role=equipe] .money-only{display:none!important}
.ltot{min-height:44px;display:flex;align-items:center;justify-content:flex-end;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:680px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{background:linear-gradient(180deg,#2f5496,#4472c4);color:#fff;padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:6}
header .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
header h1{font:600 20px/1.1 var(--display);margin:0;flex:1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;min-height:40px}
.mark{font:700 22px/1 "Times New Roman",serif;letter-spacing:.04em}
main.wrap{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font:600 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-deep);margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{width:100%;font:500 16px var(--body);color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button,.btn{font:600 15px var(--body);border-radius:9px;min-height:44px;padding:0 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.primary,.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--brand-deep);padding:0 8px}
button.danger{color:var(--warn)}
button.small{min-height:34px;font-size:14px;padding:0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.hint{font-size:13px;color:var(--muted);margin:0}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none;min-height:52px}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;font-weight:600;white-space:nowrap}
.item .r small{display:block;font-weight:500}
.tag{display:inline-block;font:600 12px/1 var(--body);padding:4px 7px;border-radius:20px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand-deep);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.tag.amber{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.tag.grey{background:color-mix(in srgb,var(--muted) 15%,transparent);color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:inherit}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font:700 22px/1.2 var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.warn b{color:var(--warn)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 12px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:96px}
.tile span{font-size:26px}
.tile b{font:600 16px var(--display)}
.tile small{color:var(--muted);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a span{font-size:20px;line-height:1}
nav.tabs a.on{color:var(--brand-deep)}
.search{position:relative}
.money{font-variant-numeric:tabular-nums}
table.lines{width:100%;border-collapse:collapse;font-size:14px}
.line{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:.8fr 1fr 1.2fr auto;gap:8px;align-items:end}
.line .des{grid-column:1/-1}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.totals .big{font:700 19px var(--display);color:var(--brand-deep)}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}

.seg button.on.A{background:var(--warn)}
.seg button.on.D{background:var(--amber)}

#toast.on{opacity:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{min-height:36px;border-radius:20px;font-size:14px;white-space:nowrap}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
#rapFrame{position:fixed;left:0;right:0;top:calc(56px + env(safe-area-inset-top,0px));width:100%;height:calc(100vh - 114px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - 114px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:var(--bg);z-index:4}
.bars{display:flex;align-items:flex-end;gap:4px;padding-top:8px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bars i{display:block;width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.bars i.e{background:var(--ok);opacity:.75}
.bars small{font-size:10px;color:var(--muted)}
.bar2{display:flex;gap:2px;align-items:flex-end;width:100%;height:130px}
.bar2 i{flex:1}
.hbar{height:8px;border-radius:4px;background:var(--brand);margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal b{font-size:11px;color:var(--muted);font-weight:600}
.cal span{border-radius:7px;padding:5px 0;background:var(--input);border:1px solid var(--line);line-height:1.15}
.cal span small{display:block;font-weight:700;font-size:11px}
.cal span.P{background:color-mix(in srgb,var(--ok) 16%,var(--card));border-color:transparent}
.cal span.D{background:color-mix(in srgb,var(--amber) 20%,var(--card));border-color:transparent}
.cal span.A{background:color-mix(in srgb,var(--warn) 16%,var(--card));border-color:transparent}
.cal span.x{visibility:hidden}
.side{display:none}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
table.tbl th{text-align:left;font:600 12px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl td.n,table.tbl th.n{text-align:right;white-space:nowrap}
table.tbl tr.go{cursor:pointer}
table.tbl tr.go:hover td{background:color-mix(in srgb,var(--brand) 7%,transparent)}
table.tbl td b{font-weight:600}
.duo{display:flex;flex-direction:column;gap:12px}
.kbd{font:600 11px var(--body);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
@media (min-width:1000px){
  body{padding-bottom:0;padding-left:232px}
  nav.tabs{display:none}
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--card);border-right:1px solid var(--line);z-index:7;padding:0 0 12px}
  .side .brand{background:linear-gradient(180deg,#2f5496,#4472c4);color:#fff;height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;font:700 22px/1 "Times New Roman",serif;letter-spacing:.04em}
  .side .brand small{font:600 12px var(--display);letter-spacing:.1em;opacity:.85}
  .side nav{display:flex;flex-direction:column;padding:10px 10px;gap:2px;overflow:auto;flex:1}
  .side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--fg);text-decoration:none;font-weight:600;font-size:15px}
  .side a span{font-size:18px;width:22px;text-align:center}
  .side a:hover{background:color-mix(in srgb,var(--brand) 8%,transparent)}
  .side a.on{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand-deep)}
  .side hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
  .side .foot{padding:0 18px;font-size:12px;color:var(--muted)}
  header .mark{display:none}
  .wrap{max-width:1240px}
  main.wrap{padding-left:28px;padding-right:28px;padding-block:22px;gap:16px}
  header .wrap{padding-left:28px;padding-right:28px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .grid{grid-template-columns:repeat(3,1fr)}
  .duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .duo>.duo{min-width:0;width:100%;align-items:stretch}
  .line{grid-template-columns:4fr 1fr 1.3fr 1.3fr auto}
  .line .des{grid-column:auto}
  #toast{bottom:24px;left:calc(50% + 116px)}
  #rapFrame{left:232px;width:calc(100% - 232px);height:calc(100vh - 56px);bottom:0}
  .mob{display:none!important}
}
@media (max-width:999px){.desk{display:none!important}}
@media (max-width:370px){.grid{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}}
</style>

<script>
(function(){
'use strict';
/* =================== Données =================== */
// Mode démo : par le lien ?demo=1 ou par le bouton « Voir la démo » (mémorisé dans ce téléphone)
if(/[?&]demo=1/.test(location.search))try{localStorage.setItem('sogei-mode','demo')}catch(e){}
const DEMO=(()=>{try{return localStorage.getItem('sogei-mode')==='demo'}catch(e){return false}})();
const KEY=DEMO?'sogei-gestion-demo':'sogei-gestion-v1';
const DEF={
  settings:{societe:"Sté Générale d'Équipement Hydraulique et Électrique",mf:'',rc:'',tel:'74 427 522',gsm:'51 617 617',adresse:"Rue Ibn Badis, Avenue d'Algérie Sfax 3000",rib:'',tva:19,timbre:1,signataire:'KHALED GRAYRI',fonction:'Gérant',cachet:true,lastBackup:null},
  clients:[],interventions:[],docs:[],paiements:[],articles:[],mouvements:[],employes:[],pointage:{},avances:[],caisse:[]
};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const DEMO_V=2; // à augmenter quand demo.json change
const needDemo=DEMO&&(!S||typeof S!=='object'||!S.demoLoaded||S.demoV!==DEMO_V);
if(!S||typeof S!=='object')S=JSON.parse(JSON.stringify(DEF));
for(const k in DEF){if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(DEF[k]))}
S.settings=Object.assign({},DEF.settings,S.settings);
// Client passager : toujours présent, non supprimable
const PASS='passager';
if(!S.clients.some(c=>c.id===PASS))S.clients.unshift({id:PASS,nom:'Client passager',tel:'',adresse:'',notes:'Client de passage (nom facultatif sur chaque chantier, devis ou facture)'});
function save(){
  if(typeof monRole!=='undefined'&&monRole==='lecture'){toast('Compte en lecture seule : modification non enregistrée');try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}setTimeout(route,50);return}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Mémoire pleine : faites une sauvegarde')}
  if(typeof schedSync==='function')schedSync();
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ym=d=>String(d||'').slice(0,7);
const byId=(arr,id)=>S[arr].find(x=>x.id===id);
// Nom affiché : pour le client passager, le nom saisi sur le document s'il existe
function cName(o){const c=byId('clients',o.clientId);if(o.clientId==='passager'&&o.nomLibre)return o.nomLibre+' (passager)';return c?c.nom:'?'}
const sortC=(a,b)=>(b.id==='passager')-(a.id==='passager')||a.nom.localeCompare(b.nom);

/* =================== Outils =================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>{const n=parseFloat(String(x??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const r3=n=>Math.round(n*1000)/1000;
function dt(n,dec=3){const s=Math.abs(r3(n)).toFixed(dec),[i,d]=s.split('.');return (n<0?'−':'')+i.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(d?','+d:'')}
const DT=n=>dt(n)+' DT';
const frD=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''};
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const moisLabel=m=>{const [y,mo]=m.split('-');return MOIS[+mo-1]+' '+y};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function telLink(t){const d=String(t||'').replace(/\D/g,'');return d?'tel:'+(d.length===8?'+216'+d:d):''}
function waLink(t,msg){let d=String(t||'').replace(/\D/g,'');if(d.length===8)d='216'+d;if(d.startsWith('00'))d=d.slice(2);return d?'https://wa.me/'+d+(msg?'?text='+encodeURIComponent(msg):''):''}
function mapLink(c){const g=String(c.gps||'').trim();if(g)return /^https?:/.test(g)?g:'https://maps.google.com/?q='+encodeURIComponent(g);return c.adresse?'https://maps.google.com/?q='+encodeURIComponent(c.adresse):''}

/* Montant en lettres (dinars / millimes) */
function enLettres(n){
  const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
  const D={2:'vingt',3:'trente',4:'quarante',5:'cinquante',6:'soixante'};
  function lt100(n){
    if(n<17)return U[n];if(n<20)return 'dix-'+U[n-10];
    const d=Math.floor(n/10),u=n%10;
    if(d===7)return 'soixante'+(u===1?'-et-':'-')+lt100(10+u);
    if(d===9)return 'quatre-vingt-'+lt100(10+u);
    if(d===8)return 'quatre-vingt'+(u?'-'+U[u]:'s');
    return D[d]+(u===1?'-et-un':u?'-'+U[u]:'');
  }
  function lt1000(n){const c=Math.floor(n/100),r=n%100;let s='';if(c)s=(c>1?U[c]+'-cent':'cent')+(c>1&&!r?'s':'');if(r)s+=(s?'-':'')+lt100(r);return s||'zéro'}
  function full(n){
    if(n===0)return 'zéro';const parts=[];
    const mil=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000;
    if(mil)parts.push(lt1000(mil)+(mil>1?' millions':' million'));
    if(k)parts.push(k===1?'mille':lt1000(k).replace(/(cent|vingt)s$/,'$1')+'-mille');
    if(r)parts.push(lt1000(r));
    return parts.join(' ');
  }
  const t=Math.round(n*1000),di=Math.floor(t/1000),mi=t%1000;
  let s=full(di)+(di>1?' dinars':' dinar');
  if(mi)s+=' et '+full(mi)+(mi>1?' millimes':' millime');
  return s.charAt(0).toUpperCase()+s.slice(1);
}

/* =================== Calculs =================== */
function docTotals(d){
  const ht=r3((d.lignes||[]).reduce((a,l)=>a+num(l.qte)*num(l.pu),0));
  const remise=r3(ht*num(d.remise)/100);
  const base=r3(ht-remise);
  const tva=r3(base*num(d.tva)/100);
  const timbre=d.kind==='facture'?num(d.timbre):0;
  const ttc=r3(base+tva+timbre);
  return {ht,remise,base,tva,timbre,ttc};
}
const KL={devis:'Devis',facture:'Facture',bl:'Bon de livraison'};
const paye=d=>r3(S.paiements.filter(p=>p.docId===d.id).reduce((a,p)=>a+num(p.montant),0));
function docEtat(d){
  if(d.kind==='bl')return d.factureId?['Facturé','ok']:['Livré',''];
  if(d.kind==='devis'){const m={brouillon:['Brouillon','grey'],envoye:['Envoyé','amber'],accepte:['Accepté','ok'],refuse:['Refusé','warn']};if(d.factureId)return ['Facturé','ok'];return m[d.statut||'brouillon']}
  const t=docTotals(d).ttc,p=paye(d);
  if(t>0&&p>=t-0.0005)return ['Payée','ok'];if(p>0)return ['Partielle','amber'];return ['Impayée','warn'];
}
const reste=d=>r3(docTotals(d).ttc-paye(d));
const stockOf=a=>r3(num(a.stock0)+S.mouvements.filter(m=>m.articleId===a.id).reduce((s,m)=>s+num(m.qte),0));
function nextNum(kind,date){
  const y=String(date||today()).slice(0,4),p=({devis:'D',facture:'F',bl:'BL'}[kind])+'-'+y+'-';
  const max=S.docs.filter(d=>d.kind===kind&&String(d.num||'').startsWith(p)).reduce((m,d)=>Math.max(m,parseInt(d.num.slice(p.length))||0),0);
  return p+String(max+1).padStart(3,'0');
}
// Sorties de stock : au bon de livraison, ou à la facture s'il n'y a pas eu de BL
function applyStock(d){
  S.mouvements=S.mouvements.filter(m=>m.docId!==d.id);
  if(!(d.kind==='bl'||(d.kind==='facture'&&!d.fromBL)))return;
  (d.lignes||[]).forEach(l=>{if(l.articleId&&byId('articles',l.articleId)&&num(l.qte))S.mouvements.push({id:uid(),articleId:l.articleId,date:d.date,qte:-num(l.qte),motif:(d.kind==='bl'?'BL ':'Facture ')+d.num,docId:d.id})});
}
// Journal de caisse = opérations saisies + paiements reçus + avances sur salaire
function journal(){
  const L=S.caisse.map(c=>({id:c.id,date:c.date,montant:c.sens==='-'?-num(c.montant):num(c.montant),lib:(c.categorie||'')+(c.note?' — '+c.note:''),src:'caisse'}));
  S.paiements.forEach(p=>{const d=byId('docs',p.docId),c=d&&byId('clients',d.clientId);L.push({id:p.id,date:p.date,montant:num(p.montant),lib:'Paiement '+(d?d.num:'')+(c?' — '+c.nom:'')+(p.mode?' ('+p.mode+')':''),src:'paiement',docId:p.docId})});
  S.avances.forEach(a=>{const e=byId('employes',a.empId);L.push({id:a.id,date:a.date,montant:-num(a.montant),lib:'Acompte salaire — '+(e?e.nom:''),src:'avance'})});
  return L.sort((a,b)=>b.date.localeCompare(a.date));
}
function recapEmp(e,m){
  let P=0,D=0,A=0;
  Object.keys(S.pointage).filter(d=>d.startsWith(m)).forEach(d=>{const v=S.pointage[d][e.id];if(v==='P')P++;else if(v==='D')D++;else if(v==='A')A++});
  const jours=P+D/2;
  const du=e.type==='mois'?num(e.salaire):r3(jours*num(e.salaire));
  const av=r3(S.avances.filter(a=>a.empId===e.id&&a.date.startsWith(m)).reduce((s,a)=>s+num(a.montant),0));
  return {P,D,A,jours,du,av,net:r3(du-av)};
}

  const F=[['actives','En cours / à faire'],['afacturer','À facturer'],['tout','Tout']];
  V.innerHTML=`<div class="chips">${F.map(([k,l])=>`<button data-f="${k}" class="${interFilter===k?'on':''}">${l}</button>`).join('')}</div><input id="q" type="search" placeholder="Rechercher…"><div class="card"><div class="list" id="L"></div></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();
    let L=S.interventions.filter(i=>{if(interFilter==='actives')return i.statut==='afaire'||i.statut==='encours';if(interFilter==='afacturer')return i.statut==='termine'&&!i.factureId;return true});
    L=L.filter(i=>{return (cName(i)+' '+typeL(i.type)+' '+(i.lieu||'')+' '+(i.description||'')).toLowerCase().includes(q)});
    L.sort((a,b)=>interFilter==='actives'?(a.date||'').localeCompare(b.date||''):(b.date||'').localeCompare(a.date||''));
    if(WIDE()&&L.length){$('#L').innerHTML=`<table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Client</th><th>Lieu</th><th>Équipe</th><th>Rapport</th><th>État</th></tr></thead><tbody>${L.map(i=>{const f=i.factureId&&byId('docs',i.factureId);
      return `<tr class="go" data-h="#/inter/${i.id}"><td>${frD(i.date)}</td><td><b>${esc(typeL(i.type))}</b></td><td>${esc(cName(i))}</td><td>${esc(i.lieu||'')}</td><td>${esc((i.employes||[]).map(e=>(byId('employes',e)||{}).nom).filter(Boolean).join(', '))}</td><td>${rapFait(i)?'📄':''}</td><td>${f?`<a class="tag ok" href="#/doc/${f.id}">${esc(f.num)}</a>`:statT(i.statut)}</td></tr>`}).join('')}</tbody></table>`;tblClick($('#L'));return}
    $('#L').innerHTML=L.map(interItem).join('')||'<div class="empty">Aucune intervention.</div>'};
  V.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{interFilter=b.dataset.f;interventions()});
  $('#q').oninput=draw;draw();
}
function interEdit(id){
  tab('interventions');
  const qs=new URLSearchParams(location.hash.split('?')[1]||'');
  const isNew=id.startsWith('new');
  const i=isNew?{id:uid(),date:today(),type:'essai',statut:'afaire',clientId:qs.get('c')||'passager',employes:[]}:JSON.parse(JSON.stringify(byId('interventions',id)||{}));
  if(!i.id)return go('#/interventions');
  const nc=sessionStorage.getItem('newClient');if(nc){i.clientId=nc;sessionStorage.removeItem('newClient')}
  const draft=sessionStorage.getItem('interDraft');if(draft&&isNew){Object.assign(i,JSON.parse(draft),{clientId:i.clientId||JSON.parse(draft).clientId});sessionStorage.removeItem('interDraft')}
  setHead(isNew?'Nouvelle intervention':'Intervention',{back:'#/interventions'});
  const SPEC=[{k:'clientId',l:'Client',t:'select',o:clientOpts(),full:1},{k:'nomLibre',l:'Nom du client passager (facultatif)'},{k:'telLibre',l:'Téléphone (facultatif)',t:'tel'},{k:'type',l:'Type',t:'select',o:TYPES},{k:'statut',l:'Statut',t:'select',o:STATUTS.map(s=>[s[0],s[1]])},{k:'date',l:'Date prévue',t:'date'},{k:'lieu',l:'Lieu / forage'},{k:'description',l:'Travaux / remarques',t:'textarea'}];
  const emps=S.employes.filter(e=>e.actif!==false||(i.employes||[]).includes(e.id));
  const f=i.factureId&&byId('docs',i.factureId);
  V.innerHTML=`<div class="card">${fields(SPEC,i)}<button class="ghost small" id="newC" style="align-self:flex-start">+ Nouveau client</button></div>
  <div class="card"><h2>Équipe sur place</h2>${emps.length?`<div class="chips" id="E" style="flex-wrap:wrap">${emps.map(e=>`<button data-e="${e.id}" class="${(i.employes||[]).includes(e.id)?'on':''}">${esc(e.nom)}</button>`).join('')}</div>`:'<p class="hint">Ajoutez vos salariés dans Plus → Équipe.</p>'}</div>
  ${isNew?'':`<div class="card"><h2>Suite</h2>
    <a class="btn${i.type==='essai'?' primary':''}" href="#/rapport/${i.id}">📄 Rapport d'essai de débit${rapFait(i)?' ✓':''}</a>
    ${f?`<a class="btn" href="#/doc/${f.id}">🧾 Voir la facture ${esc(f.num)}</a>`:`<div class="row"><button class="grow" id="mkDevis">Faire un devis</button><button class="grow" id="mkBL">🚚 Bon de livraison</button><button class="grow primary" id="mkFact">Facturer</button></div>`}
  </div>`}
  <div class="row"><button class="primary grow" id="ok">Enregistrer</button>${isNew?'':'<button class="danger" id="del">Supprimer</button>'}</div>`;
  passToggle();
  V.querySelectorAll('#E button').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  const collect=()=>{read(SPEC,i);i.employes=[...V.querySelectorAll('#E button.on')].map(b=>b.dataset.e);return i};
  $('#newC').onclick=()=>{collect();sessionStorage.setItem('interDraft',JSON.stringify(Object.assign({},i,{id:undefined})));go('#/client-edit/new?back=1')};
  const store=()=>{collect();if(!i.clientId){toast('Choisissez un client');return false}const k=S.interventions.findIndex(x=>x.id===i.id);if(k<0)S.interventions.push(i);else S.interventions[k]=i;save();return true};
  $('#ok').onclick=()=>{if(store()){toast('Intervention enregistrée');location.replace('#/interventions')}};
  if(!isNew){
    confirmBtn($('#del'),()=>{S.interventions=S.interventions.filter(x=>x.id!==i.id);save();go('#/interventions')});
    const mk=k=>()=>{if(store())go('#/doc-edit/new?k='+k+'&c='+i.clientId+'&i='+i.id)};
    if($('#mkDevis'))$('#mkDevis').onclick=mk('devis');if($('#mkBL'))$('#mkBL').onclick=mk('bl');if($('#mkFact'))$('#mkFact').onclick=mk('facture');
  }
}

/* ---------- Devis / factures ---------- */
function docItem(d){const c=byId('clients',d.clientId),[l,cl]=docEtat(d),t=docTotals(d).ttc,r=d.kind==='facture'?reste(d):0;
  if(d.kind==='bl')return `<a class="item" href="#/doc/${d.id}"><div class="t"><b>${esc(d.num)} — ${esc(cName(d))}</b><small>Bon de livraison du ${frD(d.date)} · ${d.lignes.length} ligne(s)</small></div><div class="r"><span class="tag ${cl}">${l}</span></div></a>`;
  return `<a class="item" href="#/doc/${d.id}"><div class="t"><b>${esc(d.num)} — ${esc(cName(d))}</b><small>${KL[d.kind]} du ${frD(d.date)}</small></div><div class="r money">${dt(t)}<small><span class="tag ${cl}">${l}</span>${r>0.0005&&r<t-0.0005?' '+dt(r):''}</small></div></a>`}
let docFilter='factures';
const WIDE=()=>matchMedia('(min-width:1000px)').matches;
function tblClick(root){root.querySelectorAll('tr[data-h]').forEach(tr=>tr.onclick=e=>{if(e.target.closest('a,button'))return;location.hash=tr.dataset.h})}
function docTable(L){
  return `<table class="tbl"><thead><tr><th>N°</th><th>Date</th><th>Client</th><th class="n">Total TTC</th><th class="n">Payé</th><th class="n">Reste</th><th>État</th></tr></thead><tbody>${L.map(d=>{const t=docTotals(d).ttc,[l,cl]=docEtat(d),isF=d.kind==='facture',p=isF?paye(d):0,r=isF?reste(d):0;
    return `<tr class="go" data-h="#/doc/${d.id}"><td><b>${esc(d.num)}</b></td><td>${frD(d.date)}</td><td>${esc(cName(d))}</td><td class="n"><b>${dt(t)}</b></td><td class="n">${isF?dt(p):''}</td><td class="n" style="color:${r>0.0005?'var(--warn)':'inherit'}">${isF?dt(r):''}</td><td><span class="tag ${cl}">${l}</span></td></tr>`}).join('')}</tbody></table>`}
function blTable(L){return `<table class="tbl"><thead><tr><th>N°</th><th>Date</th><th>Client</th><th>Articles livrés</th><th>État</th></tr></thead><tbody>${L.map(d=>{const [l,cl]=docEtat(d),f=d.factureId&&byId('docs',d.factureId);
  return `<tr class="go" data-h="#/doc/${d.id}"><td><b>${esc(d.num)}</b></td><td>${frD(d.date)}</td><td>${esc(cName(d))}</td><td>${esc(d.lignes.map(x=>String(x.qte).replace('.',',')+' × '+x.des).join(' · ').slice(0,90))}</td><td>${f?`<a class="tag ok" href="#/doc/${f.id}">${esc(f.num)}</a>`:`<span class="tag ${cl}">${l}</span>`}</td></tr>`}).join('')}</tbody></table>`}
function docs(){
  tab('docs');
  const qs=new URLSearchParams(location.hash.split('?')[1]||'');if(qs.get('f'))docFilter=qs.get('f');
  setHead('Devis & factures',{act:'<button class="small" onclick="location.hash=\'#/doc-edit/new?k=facture\'">+ Facture</button>'});
  const F=[['factures','Factures'],['impayees','Impayées'],['devis','Devis'],['bl','Bons de livraison']];
  V.innerHTML=`<div class="chips">${F.map(([k,l])=>`<button data-f="${k}" class="${docFilter===k?'on':''}">${l}</button>`).join('')}<button onclick="location.hash='#/doc-edit/new?k=devis'">+ Devis</button><button onclick="location.hash='#/doc-edit/new?k=bl'">+ BL</button></div><input id="q" type="search" placeholder="Numéro, client…"><div class="card"><div class="list" id="L"></div><p class="hint" id="T"></p></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();
    let L=S.docs.filter(d=>docFilter==='devis'||docFilter==='bl'?d.kind===docFilter:d.kind==='facture'&&(docFilter!=='impayees'||reste(d)>0.0005));
    L=L.filter(d=>{return (d.num+' '+cName(d)).toLowerCase().includes(q)}).sort((a,b)=>b.date.localeCompare(a.date)||b.num.localeCompare(a.num));
    $('#L').innerHTML=L.length?(WIDE()?(docFilter==='bl'?blTable(L):docTable(L)):L.map(docItem).join('')):'<div class="empty">Aucun document.</div>';tblClick($('#L'));
    $('#T').textContent=docFilter==='bl'?(L.length?L.length+' bon(s) de livraison':''):L.length?L.length+' document(s) · total '+DT(L.reduce((a,d)=>a+(docFilter==='impayees'?reste(d):docTotals(d).ttc),0)):''};
  V.querySelectorAll('.chips button[data-f]').forEach(b=>b.onclick=()=>{docFilter=b.dataset.f;history.replaceState(null,'','#/docs');docs()});
  $('#q').oninput=draw;draw();
}
function docEdit(id){
  tab('docs');
  const qs=new URLSearchParams(location.hash.split('?')[1]||'');
  const isNew=id==='new';
  let d;
  if(isNew){const k=['devis','bl'].includes(qs.get('k'))?qs.get('k'):'facture';
    d={id:uid(),kind:k,date:today(),clientId:qs.get('c')||'passager',interventionId:qs.get('i')||'',lignes:[{des:'',qte:'1',pu:''}],tva:S.settings.tva,timbre:k==='facture'?S.settings.timbre:0,remise:'',statut:'brouillon',notes:'',validite:'30'};
    const inter=d.interventionId&&byId('interventions',d.interventionId);
    if(inter){d.nomLibre=inter.nomLibre||'';d.telLibre=inter.telLibre||''}
    if(inter)d.lignes=[{des:typeL(inter.type)+(inter.lieu?' — '+inter.lieu:''),qte:'1',pu:''}];
  }else{d=JSON.parse(JSON.stringify(byId('docs',id)||{}));if(!d.id)return go('#/docs')}
  const nc=sessionStorage.getItem('newClient');if(nc){d.clientId=nc;sessionStorage.removeItem('newClient')}
  const dr=sessionStorage.getItem('docDraft');if(dr&&isNew){const o=JSON.parse(dr);Object.assign(d,o,{id:d.id,clientId:d.clientId||o.clientId});sessionStorage.removeItem('docDraft')}
  const isF=d.kind==='facture',isBL=d.kind==='bl';
  setHead(isNew?({facture:'Nouvelle facture',devis:'Nouveau devis',bl:'Nouveau bon de livraison'}[d.kind]):KL[d.kind]+' '+(d.num||''),{back:'#/docs'});
  const HEAD=[{k:'clientId',l:'Client',t:'select',o:clientOpts(),full:1},{k:'nomLibre',l:'Nom du client passager (facultatif)'},{k:'telLibre',l:'Téléphone (facultatif)',t:'tel'},{k:'date',l:isBL?'Date de livraison':'Date',t:'date'},isBL?{k:'livraison',l:'Adresse / lieu de livraison'}:isF?{k:'echeance',l:'Échéance (facultatif)',t:'date'}:{k:'validite',l:'Validité (jours)',t:'number'}];
  if(isBL)HEAD.push({k:'livreur',l:'Livré par'});
  V.innerHTML=`<datalist id="arts">${S.articles.map(a=>`<option value="${esc(a.des)}">`).join('')}</datalist>
  <div class="card">${fields(HEAD,d)}<button class="ghost small" id="newC" style="align-self:flex-start">+ Nouveau client</button></div>
  <div class="card"><h2>${isBL?'Articles livrés':'Lignes'} <span class="hint" style="text-transform:none;letter-spacing:0">${isBL?'quantités':'prix HT en DT'}</span></h2><div id="LN" style="display:flex;flex-direction:column;gap:8px"></div><button id="addL">+ Ajouter une ligne</button></div>
  <div class="card"${isBL?' hidden':''}><div class="grid"><label>Remise (%)<input id="remise" inputmode="decimal" value="${esc(d.remise)}"></label><label>TVA (%)<input id="tva" inputmode="decimal" value="${esc(d.tva)}"></label>${isF?`<label>Timbre fiscal (DT)<input id="timbre" inputmode="decimal" value="${esc(d.timbre)}"></label>`:''}</div>
  <div class="totals" id="TOT"></div></div>
  <div class="card"><label>Notes (apparaissent sur le PDF)<textarea id="notes" placeholder="${isBL?'Observations, état du matériel…':'Conditions, garantie, délai…'}">${esc(d.notes||'')}</textarea></label></div>
  <div class="row"><button class="primary grow" id="ok">Enregistrer</button>${isNew?'':'<button class="danger" id="del">Supprimer</button>'}</div>`;
  passToggle();
  const LN=$('#LN');
  function drawLines(){
    LN.innerHTML=d.lignes.map((l,k)=>`<div class="line" data-k="${k}">
      <label class="des">Désignation<input data-f="des" list="arts" value="${esc(l.des)}" autocomplete="off"></label>
      <label>Qté<input data-f="qte" inputmode="decimal" value="${esc(l.qte)}"></label>
      <label${isBL?' hidden':''}>P.U. HT<input data-f="pu" inputmode="decimal" value="${esc(l.pu)}"></label>
      <label${isBL?' hidden':''}>Total HT<span class="ltot" data-tot>${dt(num(l.qte)*num(l.pu))}</span></label>
      <button class="ghost danger small" data-del aria-label="Supprimer la ligne">✕</button>
      <p class="hint" data-art style="grid-column:1/-1"${l.articleId?'':' hidden'}>📦 Article du stock${isBL||(isF&&!d.fromBL)?' — sortie de stock à l’enregistrement':''}</p></div>`).join('');
    LN.querySelectorAll('.line').forEach(row=>{const k=+row.dataset.k;
      row.querySelectorAll('input[data-f]').forEach(inp=>inp.oninput=()=>{const l=d.lignes[k];l[inp.dataset.f]=inp.value;
        if(inp.dataset.f==='des'){const a=S.articles.find(a=>a.des===inp.value);if(a){l.articleId=a.id;if(!l.pu){l.pu=String(a.pv||'');row.querySelector('[data-f=pu]').value=l.pu}}else delete l.articleId;row.querySelector('[data-art]').hidden=!l.articleId}
        row.querySelector('[data-tot]').textContent=dt(num(l.qte)*num(l.pu));tot()});
      row.querySelector('[data-del]').onclick=()=>{d.lignes.splice(k,1);if(!d.lignes.length)d.lignes.push({des:'',qte:'1',pu:''});drawLines();tot()};
    });
  }
  function readTop(){read(HEAD,d);d.remise=$('#remise').value;d.tva=$('#tva').value;if(isF)d.timbre=$('#timbre').value;d.notes=$('#notes').value}
  function tot(){readTop();const t=docTotals(d);$('#TOT').innerHTML=`<span>Total HT</span><b>${DT(t.ht)}</b>${t.remise?`<span>Remise ${esc(d.remise)} %</span><b>−${DT(t.remise)}</b><span>Net HT</span><b>${DT(t.base)}</b>`:''}<span>TVA ${esc(d.tva)} %</span><b>${DT(t.tva)}</b>${isF?`<span>Timbre fiscal</span><b>${DT(t.timbre)}</b>`:''}<span class="big">Total TTC</span><span class="big">${DT(t.ttc)}</span>`}
  ['remise','tva','timbre','notes'].forEach(k=>{const e=$('#'+k);if(e)e.oninput=tot});
  $('#addL').onclick=()=>{d.lignes.push({des:'',qte:'1',pu:''});drawLines();LN.lastElementChild.querySelector('input').focus()};
  $('#newC').onclick=()=>{readTop();sessionStorage.setItem('docDraft',JSON.stringify(d));go('#/client-edit/new?back=1')};
  drawLines();tot();
  $('#ok').onclick=()=>{readTop();if(!d.clientId)return toast('Choisissez un client');
    d.lignes=d.lignes.filter(l=>String(l.des).trim()||num(l.pu));if(!d.lignes.length)return toast('Ajoutez au moins une ligne');
    if(isBL&&d.fromDevis){const dv=byId('docs',d.fromDevis);if(dv){dv.blId=d.id;dv.statut='accepte'}}
    if(!d.num)d.num=nextNum(d.kind,d.date);
    const k=S.docs.findIndex(x=>x.id===d.id);if(k<0)S.docs.push(d);else S.docs[k]=d;
    if(isF&&d.interventionId){const it=byId('interventions',d.interventionId);if(it){it.factureId=d.id;if(it.statut!=='annule')it.statut='termine'}}
    if(isF&&d.fromDevis){const dv=byId('docs',d.fromDevis);if(dv){dv.factureId=d.id;dv.statut='accepte'}}
    applyStock(d);save();toast(KL[d.kind]+' '+d.num+' enregistré'+(isF?'e':''));location.replace('#/doc/'+d.id)};
  if(!isNew)confirmBtn($('#del'),()=>{
    if(isF&&S.paiements.some(p=>p.docId===d.id))return toast('Supprimez d’abord les paiements de cette facture');
    S.docs=S.docs.filter(x=>x.id!==d.id);S.mouvements=S.mouvements.filter(m=>m.docId!==d.id);
    S.interventions.forEach(i=>{if(i.factureId===d.id)delete i.factureId});S.docs.forEach(x=>{if(x.factureId===d.id)delete x.factureId;if(x.blId===d.id)delete x.blId;if(x.fromBL===d.id){delete x.fromBL;applyStock(x)}});
    save();go('#/docs')});
}

    <div class="totals"${isBL?' hidden':''}><span>Total HT</span><b>${DT(t.ht)}</b>${t.remise?`<span>Remise</span><b>−${DT(t.remise)}</b>`:''}<span>TVA ${esc(d.tva)} %</span><b>${DT(t.tva)}</b>${isF?`<span>Timbre</span><b>${DT(t.timbre)}</b>`:''}<span class="big">Total TTC</span><span class="big">${DT(t.ttc)}</span>

  ${isF?`<div class="card"><h2>Paiements</h2><div class="list">${pays.map(p=>`<div class="item"><div class="t"><b>${DT(num(p.montant))}</b><small>${frD(p.date)} · ${esc(p.mode||'')}${p.note?' · '+esc(p.note):''}</small></div><button class="ghost danger small" data-dp="${p.id}">Supprimer</button></div>`).join('')||'<div class="empty">Aucun paiement.</div>'}</div>

/* ---------- PDF (modèle SOGEI) ---------- */
let ASSETS=null;

  const rtext=(s,x,yy,f,sz,col)=>text(s,x-f.widthOfTextAtSize(safe(s),sz),yy,f,sz,col);
  const rect=(x,yt,w,h,o)=>page.drawRectangle(Object.assign({x,y:H-(yt+h),width:w,height:h},o));
  const wrap=(s,f,sz,max)=>{const out=[];String(s||'').split(/\n/).forEach(par=>{let line='';safe(par).split(/\s+/).filter(Boolean).forEach(w=>{const tt=line?line+' '+w:w;if(f.widthOfTextAtSize(tt,sz)>max&&line){out.push(line);line=w}else line=tt});out.push(line)});return out};
  newPage();

  const tw=bold.widthOfTextAtSize(safe(title),20);text(title,(XL+XR)/2-tw/2,150,bold,20,black);

  const fa=isBL&&d.factureId&&byId('docs',d.factureId),dvs=isBL&&d.fromDevis&&byId('docs',d.fromDevis);

  const isP=d.clientId==='passager';const cl=(isP?[d.nomLibre||'Client passager',d.telLibre?'Tél : '+d.telLibre:'']:[c.nom||'',c.adresse||'',c.tel?'Tél : '+c.tel:'',c.mf?'MF : '+c.mf:'']).filter(Boolean);

    else{rtext(String(l.qte).replace('.',','),cQ+18,y+14,reg,10,ink);

    let sy2=by;const SX2=448;
    ["Sté Générale d'Équipement","Hydraulique et Électrique",st.signataire,st.fonction].forEach(s=>{if(!s)return;const w=bold.widthOfTextAtSize(safe(s),10.5);text(s,SX2-w/2,sy2,bold,10.5,black);sy2+=13});
    if(st.cachet!==false){const img=await doc.embedJpg(ASSETS.cachet.slice(0));const w=72,h=w*img.height/img.width;page.drawImage(img,{x:SX2-w/2,y:H-(sy2+h),width:w,height:h})}
    const pg2=doc.getPages();if(pg2.length>1)pg2.forEach((p,k)=>p.drawText((k+1)+' / '+pg2.length,{x:XR-20,y:H-775,size:8,font:reg,color:ink}));
    return doc.save();
  }
  // Totaux
  const TL=[['Total HT',t.ht]];
  if(t.remise)TL.push(['Remise '+String(d.remise).replace('.',',')+' %',-t.remise],['Net HT',t.base]);
  TL.push(['TVA '+String(d.tva).replace('.',',')+' %',t.tva]);if(isF)TL.push(['Timbre fiscal',t.timbre]);
  const totH=TL.length*17+26;
  if(y+totH+50>BOTTOM)newPage();
  const tx=330;
  TL.forEach(([l,v])=>{text(l,tx+8,y+12,reg,10.5,ink);rtext(DT(v),cT,y+12,reg,10.5,black);y+=17});
  rect(tx,y,XR-tx,24,{color:light,borderColor:blue,borderWidth:1});
  text('Total TTC',tx+8,y+16,bold,12,blue);rtext(DT(t.ttc),cT,y+16,bold,12,blue);
  y+=36;
  // Montant en lettres
  const words=wrap((isF?'Arrêtée la présente facture à la somme de : ':'Arrêté le présent devis à la somme de : ')+enLettres(t.ttc)+'.',reg,10,XR-XL);
  words.forEach((s,k)=>{if(y>BOTTOM)newPage();text(s,XL,y+k*13,k===0?reg:reg,10,ink)});y+=words.length*13+6;
  if(d.notes){wrap(d.notes,reg,10,XR-XL).forEach(s=>{if(y>BOTTOM)newPage();text(s,XL,y,reg,10,ink);y+=13})}
  if(st.rib){if(y>BOTTOM)newPage();text('RIB : '+st.rib,XL,y,reg,10,ink);y+=13}
  // Signature
  const sigH=st.cachet!==false?120:45;
  if(y+20+sigH>760)newPage();
  let sy=y+22;const SX=448;
  ["Sté Générale d'Équipement","Hydraulique et Électrique",st.signataire,st.fonction].forEach(s=>{if(!s)return;const w=bold.widthOfTextAtSize(safe(s),11);text(s,SX-w/2,sy,bold,11,black);sy+=14});
  if(st.cachet!==false){const img=await doc.embedJpg(ASSETS.cachet.slice(0));const w=80,h=w*img.height/img.width;page.drawImage(img,{x:SX+5-w/2,y:H-(sy-4+h),width:w,height:h})}
  // Numéro de page
  const pages=doc.getPages();if(pages.length>1)pages.forEach((p,k)=>p.drawText((k+1)+' / '+pages.length,{x:XR-20,y:H-775,size:8,font:reg,color:ink}));
  return doc.save();

function pdfName(d){const c=byId('clients',d.clientId)||{};const n=String(d.clientId==='passager'?(d.nomLibre||'passager'):(c.nom||'')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');return ({facture:'Facture_',devis:'Devis_',bl:'BL_'}[d.kind])+d.num+(n?'_'+n:'')+'.pdf'}
async function shareBlob(blob,name,title){
  let file=null;try{file=new File([blob],name,{type:blob.type})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title});return 'shared'}catch(e){if(e&&e.name==='AbortError')return 'abort'}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);return 'download';
}
async function sharePdf(d){
  try{toast('Création du PDF…');const b=await docPdf(d);const r=await shareBlob(new Blob([b],{type:'application/pdf'}),pdfName(d),pdfName(d));
    if(r!=='abort'){if(d.kind==='devis'&&(d.statut||'brouillon')==='brouillon'){d.statut='envoye';save()}toast(r==='shared'?'PDF partagé':'PDF téléchargé')}}
  catch(e){console.error(e);toast('Erreur PDF : '+e.message)}
}

/* ---------- Rapport d'essai (même appli, rapport par chantier) ---------- */
const RKEY='sogei-rapport-v1';
let rapTimer=null;
const rapFait=i=>!!(i&&i.rapport&&(i.rapport.forages||[]).some(f=>f.profondeur||f.statique||f.debitTest));
const blankForage=()=>({nom:'FORAGE 01',profondeur:'',diametre:'200',statique:'',dynamique:'',puissance:'',tension:'',immersion:'',debitTest:'',rabattement:'',tempsInit:'',debitPropose:'',profPropose:'',puisConseil:'',tensConseil:'',observations:''});
// Enregistre ce qui est dans le rapport ouvert vers son propriétaire (chantier ou rapport libre)
function rapCapture(){
  const ctx=S.rapportCtx;if(!ctx)return;
  let r=null;try{r=JSON.parse(localStorage.getItem(RKEY))}catch(e){}
  if(!r)return;
  if(ctx==='libre')S.rapportLibre=r;else{const i=byId('interventions',ctx);if(i){i.rapport=r;if(rapFait(i)&&!i.rapportNum)i.rapportNum=nextRapNum(r.date||i.date)}}
  save();
}
// En quittant un rapport : on l'enregistre, puis on remet le rapport libre en place
function rapLeave(){
  if(!S.rapportCtx)return;rapCapture();
  if(DEMO){const r=localStorage.getItem(RKEY+'-real');if(r)localStorage.setItem(RKEY,r);else localStorage.removeItem(RKEY);localStorage.removeItem(RKEY+'-real')}
  else if(S.rapportCtx!=='libre'){try{if(S.rapportLibre)localStorage.setItem(RKEY,JSON.stringify(S.rapportLibre));else localStorage.removeItem(RKEY)}catch(e){}}
  S.rapportCtx=null;save();
}
function rapport(id){
  const inter=id==='libre'?null:byId('interventions',id);
  if(id!=='libre'&&!inter)return go('#/interventions');
  tab(inter?'interventions':'plus');
  setHead(inter?(inter.rapportNum?inter.rapportNum+' — ':'Rapport — ')+((inter.rapport&&inter.rapport.client)||cName(inter)):"Rapport d'essai",{back:'#/rapports',act:inter?`<a class="btn small" href="#/inter/${id}" style="background:rgba(255,255,255,.16);border:0;color:#fff">Chantier</a>`:''});
  if(DEMO&&localStorage.getItem(RKEY+'-real')===null)localStorage.setItem(RKEY+'-real',localStorage.getItem(RKEY)||'');
  rapCapture();
  let data;
  if(inter){
    data=inter.rapport;
    if(!data){const c=byId('clients',inter.clientId)||{},isP=inter.clientId==='passager';
      data={adresse:[inter.lieu,isP?'':c.adresse].filter(Boolean).join(', '),client:isP?(inter.nomLibre||''):(c.nom||''),contact:isP?(inter.telLibre||''):(c.tel||''),date:inter.date||today(),
        signataire:S.settings.signataire,fonction:S.settings.fonction,cachet:S.settings.cachet!==false,forages:[blankForage()]};}
  }else{
    data=S.rapportLibre||(()=>{try{return JSON.parse(localStorage.getItem(RKEY))}catch(e){return null}})()||{date:today(),signataire:S.settings.signataire,fonction:S.settings.fonction,cachet:true,forages:[blankForage()]};
  }
  try{localStorage.setItem(RKEY,JSON.stringify(data))}catch(e){}
  S.rapportCtx=id;save();
  V.innerHTML='<iframe id="rapFrame" title="Rapport d\'essai de débit" src="../?embed=1" allow="web-share; clipboard-write"></iframe>';
  rapTimer=setInterval(rapCapture,3000);
}
addEventListener('pagehide',rapCapture);
document.addEventListener('visibilitychange',()=>{if(document.hidden)rapCapture()});

/* ---------- Liste des rapports d'essai ---------- */
function nextRapNum(date){const y=String(date||today()).slice(0,4),p='R-'+y+'-';
  const max=S.interventions.reduce((m,i)=>i.rapportNum&&i.rapportNum.startsWith(p)?Math.max(m,parseInt(i.rapportNum.slice(p.length))||0):m,0);return p+String(max+1).padStart(3,'0')}
function numeroterRapports(){
  let ch=false;S.interventions.filter(i=>rapFait(i)&&!i.rapportNum).sort((a,b)=>((a.rapport.date||a.date||'')).localeCompare(b.rapport.date||b.date||'')).forEach(i=>{i.rapportNum=nextRapNum(i.rapport.date||i.date);ch=true});
  if(ch&&!(CLOUD&&monRole==='lecture'))save();
}
function rapInfo(i){const r=i.rapport||{},F=r.forages||[];
  const nom=r.client||cName(i),lieu=r.adresse||i.lieu||'';
  const q=F.map(f=>f.debitPropose||f.debitTest).filter(Boolean).map(x=>String(x).replace('.',',')+' l/s');
  return {num:i.rapportNum||'',date:r.date||i.date||'',nom,lieu,nb:F.length,deb:q.join(' / '),prof:F.map(f=>f.profondeur).filter(Boolean).map(x=>x+' m').join(' / ')}}
function rapportsList(){
  tab('plus');setHead("Rapports d'essai",{act:'<button class="small" id="newRap">+ Nouveau</button>'});
  numeroterRapports();
  V.innerHTML=`<input id="q" type="search" placeholder="Numéro, client, lieu…"><div class="card"><div class="list" id="L"></div><p class="hint" id="T"></p></div>
  <p class="hint">Chaque rapport est rattaché à un chantier. « + Nouveau » crée un chantier « Essai de débit » et ouvre son rapport. Pour envoyer le PDF : ouvrez le rapport puis « Envoyer le PDF ».</p>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();

async function paiePdf(list,m){

  const reg=await doc.embedFont(StandardFonts.Helvetica),bold=await doc.embedFont(StandardFonts.HelveticaBold);
  const img=st.cachet!==false?await doc.embedJpg(ASSETS.cachet.slice(0)):null;
  const ink=rgb(.133,.133,.133),black=rgb(0,0,0),blue=rgb(0x2f/255,0x54/255,0x96/255),white=rgb(1,1,1),grey=rgb(.955,.96,.97),rule=rgb(.82,.84,.88),light=rgb(.92,.945,.985);
  const cP=rgb(.86,.94,.89),cD=rgb(.98,.92,.8),cA=rgb(.98,.87,.86);

    const page=doc.addPage([W,H]);page.drawPage(bg,{x:0,y:0,width:W,height:H});
    const text=(t,x,yy,f,sz,c)=>page.drawText(safe(t),{x,y:H-yy,size:sz,font:f,color:c||ink});
    const rtext=(t,x,yy,f,sz,c)=>text(t,x-f.widthOfTextAtSize(safe(t),sz),yy,f,sz,c);
    const rect=(x,yt,w,h,o)=>page.drawRectangle(Object.assign({x,y:H-(yt+h),width:w,height:h},o));
    const title='ÉTAT DE SALAIRE — '+moisLabel(m).toUpperCase();

    let y=172;

      if(EDIT_RE.test(h))toast(got+' changement(s) reçu(s)');else route()}
    setSync(navigator.onLine===false?'off':'ok');
  }catch(e){console.warn('sync',e);const off=navigator.onLine===false||/fetch|network|Failed/i.test(String(e&&e.message||e));setSync(off?'off':'err',e&&e.message);
    if(/JWT|token|auth/i.test(String(e&&e.message))){const r=await sb.auth.refreshSession().catch(()=>null);if(!r||r.error){session=null;gate()}}}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;schedSync(300)}}
}
// Écran de connexion / attente
function loginView(msg){
  document.body.classList.add('locked');tab('');setHead('Connexion');
  V.innerHTML=`<div class="card"><h2>SOGEI Gestion</h2><p class="hint">Connectez-vous pour retrouver les données de l’entreprise sur ce téléphone.</p>
  ${msg?`<p style="margin:0;color:var(--warn)">${esc(msg)}</p>`:''}
  <div class="seg" id="lmode"><button class="on" data-m="in">Se connecter</button><button data-m="up">Créer un compte</button></div>
  <label id="lnom" hidden>Nom<input id="lnomI" autocomplete="name"></label>
  <label>E-mail<input id="lmail" type="email" autocomplete="username" inputmode="email"></label>
  <label>Mot de passe<input id="lpass" type="password" autocomplete="current-password"></label>
  <button class="primary" id="lgo">Se connecter</button>
  <button class="ghost small" id="lforgot" style="align-self:flex-start">Mot de passe oublié ?</button></div>
  <p class="hint">Le premier compte créé devient l’administrateur. Les comptes suivants doivent être validés par l’administrateur (Paramètres → Utilisateurs).</p>
  <button class="ghost small" id="ldemo">👀 Voir la démo sans compte</button>`;
  let mode='in';
  V.querySelectorAll('#lmode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;V.querySelectorAll('#lmode button').forEach(x=>x.classList.toggle('on',x===b));$('#lnom').hidden=mode!=='up';$('#lgo').textContent=mode==='up'?'Créer le compte':'Se connecter';$('#lpass').autocomplete=mode==='up'?'new-password':'current-password'});
  $('#ldemo').onclick=()=>{try{localStorage.setItem('sogei-mode','demo')}catch(_){}history.replaceState(null,'','./#/');location.reload()};
  $('#lforgot').onclick=async()=>{const m=$('#lmail').value.trim();if(!m)return toast('Tapez d’abord votre e-mail');const {error}=await sb.auth.resetPasswordForEmail(m,{redirectTo:location.origin+location.pathname});toast(error?'Erreur : '+error.message:'E-mail de réinitialisation envoyé')};
  $('#lgo').onclick=async()=>{const email=$('#lmail').value.trim(),password=$('#lpass').value;if(!email||!password)return toast('E-mail et mot de passe obligatoires');
    if(mode==='up'&&password.length<6)return toast('Mot de passe : 6 caractères minimum');
    const b=$('#lgo');b.disabled=true;b.textContent='Patientez…';
    try{let r;if(mode==='up'){r=await sb.auth.signUp({email,password,options:{data:{nom:$('#lnomI').value.trim()}}});if(!r.error&&!r.data.session){loginView('Compte créé. Ouvrez l’e-mail de confirmation reçu, puis connectez-vous.');return}}
      else r=await sb.auth.signInWithPassword({email,password});
      if(r.error)throw r.error;session=r.data.session;await afterLogin()}
    catch(e){toast(/Invalid login/i.test(e.message)?'E-mail ou mot de passe incorrect':/already registered/i.test(e.message)?'Ce compte existe déjà : connectez-vous':'Erreur : '+e.message);b.disabled=false;b.textContent=mode==='up'?'Créer le compte':'Se connecter'}};
}
function waitView(){
  document.body.classList.add('locked');tab('');setHead('En attente');
  V.innerHTML=`<div class="card"><h2>Compte en attente</h2><p>Votre compte <b>${esc(session.user.email)}</b> est créé. L’administrateur doit maintenant l’autoriser dans <b>Paramètres → Utilisateurs</b>.</p>
  <button class="primary" onclick="location.reload()">J’ai été autorisé — actualiser</button><button id="lout">Se déconnecter</button></div>`;
  $('#lout').onclick=logout;
}
async function fetchRole(){
  const {data,error}=await sb.from('profils').select('role,nom').eq('user_id',session.user.id).maybeSingle();
  if(error)throw error;return data?data.role:'attente';
}
async function afterLogin(){
  const uid=session.user.id;
  // Autre utilisateur sur ce téléphone : on repart de zéro
  if(SY.user&&SY.user!==uid){S=JSON.parse(JSON.stringify(DEF));S.clients.unshift({id:'passager',nom:'Client passager',tel:'',adresse:'',notes:''});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}SY={shadow:{}}}
  SY.user=uid;SY.email=session.user.email;
  try{monRole=await fetchRole();SY.role=monRole}catch(e){monRole=SY.role||null;if(!monRole){loginView('Pas de connexion internet pour vérifier le compte.');return}}
  saveSY();
  if(monRole==='attente'){waitView();return}
  // Données d'un autre rôle (ex. caisse pour « équipe ») : on ne les garde pas sur le téléphone
  if(monRole==='equipe'){MONEY.forEach(c=>{S[c]=[]});}
  document.body.classList.remove('locked');document.body.dataset.role=monRole;
  if(!chan){chan=sb.channel('items-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'items'},()=>schedSync(400)).subscribe()}
  route();syncNow();
}
async function logout(){
  const n=pending();if(n&&!confirm(n+' changement(s) pas encore envoyé(s). Se déconnecter quand même ? Ils seront perdus.'))return;
  try{await sb.auth.signOut()}catch(e){}
  try{localStorage.removeItem(KEY);localStorage.removeItem(SKEY)}catch(e){}
  location.replace('./#/');location.reload();
}
// Tant que l'utilisateur n'est pas connecté et autorisé, on bloque l'appli
function gate(){if(!CLOUD)return true;if(!session){loginView();return false}if(!monRole||monRole==='attente'){if(monRole==='attente')waitView();return false}return true}
async function initCloud(){
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sogei-auth'}});
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){session=null;monRole=null;gate()}else if(s)session=s;if(ev==='PASSWORD_RECOVERY')setTimeout(newPassword,300)});
  const {data}=await sb.auth.getSession();session=data.session;
  if(!session){loginView();return}
  // Démarrage rapide : on affiche les données du téléphone pendant la vérification du compte
  if(SY.user===session.user.id&&SY.role&&SY.role!=='attente'){monRole=SY.role;document.body.dataset.role=monRole;route()}
  await afterLogin();
  addEventListener('online',()=>schedSync(200));addEventListener('offline',()=>setSync('off'));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedSync(200)});
  setInterval(()=>schedSync(0),60000);
}
async function newPassword(){const p=prompt('Nouveau mot de passe (6 caractères minimum) :');if(!p||p.length<6)return;const {error}=await sb.auth.updateUser({password:p});toast(error?'Erreur : '+error.message:'Mot de passe changé')}
// Paramètres : compte, synchro, utilisateurs
async function cloudParams(box){
  if(!CLOUD||!session){box.innerHTML='';return}
  box.innerHTML=`<div class="card"><h2>Compte</h2><p style="margin:0"><b>${esc(session.user.email)}</b> · ${ROLE_L[monRole]||''}</p>
    <p class="hint" id="syncInfo">${syncLabel()}</p>
    <div class="row"><button class="grow" id="syncGo">🔄 Synchroniser</button><button class="grow" id="pw">🔑 Mot de passe</button><button class="grow danger" id="lout">Se déconnecter</button></div></div>
    ${monRole==='admin'?'<div class="card"><h2>Utilisateurs</h2><div class="list" id="users"><div class="empty">Chargement…</div></div><p class="hint">Pour ajouter quelqu’un : il ouvre l’appli, touche « Créer un compte », puis vous choisissez ici son accès.<br>Admin : tout + gestion des comptes · Gérant : tout sauf les comptes · Équipe : sans caisse, acomptes, salaires ni bilan · Lecture seule : consulter sans modifier.</p></div>':''}`;
  $('#syncGo').onclick=()=>syncNow().then(()=>toast(syncState==='ok'?'Synchronisé':'Synchronisation impossible'));
  $('#pw').onclick=newPassword;$('#lout').onclick=logout;
  if(monRole!=='admin')return;
  const {data,error}=await sb.from('profils').select('user_id,email,nom,role,created_at').order('created_at');
  const U=$('#users');if(!U)return;
  if(error){U.innerHTML='<div class="empty">Impossible de charger les utilisateurs (connexion ?).</div>';return}
  U.innerHTML=data.map(p=>`<div class="item"><div class="t"><b>${esc(p.nom||p.email)}${p.user_id===session.user.id?' (vous)':''}</b><small>${esc(p.email||'')}</small></div>
    <select data-u="${p.user_id}" style="width:auto;min-height:38px"${p.user_id===session.user.id?' disabled':''}>${Object.entries(ROLE_L).map(([k,l])=>`<option value="${k}"${p.role===k?' selected':''}>${k==='attente'?'Bloqué / en attente':l}</option>`).join('')}</select></div>`).join('');
  U.querySelectorAll('select[data-u]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('profils').update({role:s.value}).eq('user_id',s.dataset.u);toast(error?'Erreur : '+error.message:'Accès modifié')});
}

window.__sogeiG={get S(){return S},syncNow,items,get SY(){return SY},docPdf,paiePdf,enLettres,docTotals,recapEmp,journal,stockOf,nextNum};
if(DEMO){document.documentElement.classList.add('demo');$('.mark').insertAdjacentHTML('afterend','<span class="tag" style="background:#f0b44c;color:#3a2600">DÉMO</span>')}
(needDemo?fetch('demo.json',{cache:'no-store'}).then(r=>r.json()).then(o=>{S=o;S.demoLoaded=true;S.demoV=DEMO_V;for(const k in DEF)if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(DEF[k]));S.settings=Object.assign({},DEF.settings,S.settings);save()}).catch(()=>{V.innerHTML='<div class="card"><b>Impossible de charger la démo.</b><p class="hint">Vérifiez la connexion internet puis réessayez.</p><button class="primary" onclick="location.reload()">Réessayer</button></div>';throw 0}):Promise.resolve()).then(()=>{if(CLOUD)initCloud().catch(e=>{console.error(e);loginView('Erreur : '+e.message)});else route()},()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
