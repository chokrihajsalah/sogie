<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOGEI Gestion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5496">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SOGEI Gestion">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef2f8;--card:#fff;--fg:#17233a;--muted:#5b6a83;--line:#d5deeb;
  --brand:#4472c4;--brand-deep:#2f5496;--input:#f7f9fc;--ok:#1f7a4d;--warn:#b3261e;--amber:#9a6400;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--fg:#e6ecf7;--muted:#9aa8c2;--line:#2b3a58;--brand:#5b87d6;--brand-deep:#8fb0ea;--input:#111a2c;--ok:#5cc28f;--warn:#ff8a80;--amber:#f0b44c;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.ltot{min-height:44px;display:flex;align-items:center;justify-content:flex-end;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:680px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{background:linear-gradient(180deg,#2f5496,#4472c4);color:#fff;padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:6}
header .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
header h1{font:600 20px/1.1 var(--display);margin:0;flex:1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;min-height:40px}
.mark{font:700 22px/1 "Times New Roman",serif;letter-spacing:.04em}
main.wrap{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font:600 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-deep);margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{width:100%;font:500 16px var(--body);color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button,.btn{font:600 15px var(--body);border-radius:9px;min-height:44px;padding:0 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.primary,.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--brand-deep);padding:0 8px}
button.danger{color:var(--warn)}
button.small{min-height:34px;font-size:14px;padding:0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.hint{font-size:13px;color:var(--muted);margin:0}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none;min-height:52px}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;font-weight:600;white-space:nowrap}
.item .r small{display:block;font-weight:500}
.tag{display:inline-block;font:600 12px/1 var(--body);padding:4px 7px;border-radius:20px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand-deep);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.tag.amber{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.tag.grey{background:color-mix(in srgb,var(--muted) 15%,transparent);color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:inherit}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font:700 22px/1.2 var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.warn b{color:var(--warn)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 12px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:96px}
.tile span{font-size:26px}
.tile b{font:600 16px var(--display)}
.tile small{color:var(--muted);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a span{font-size:20px;line-height:1}
nav.tabs a.on{color:var(--brand-deep)}
.search{position:relative}
.money{font-variant-numeric:tabular-nums}
table.lines{width:100%;border-collapse:collapse;font-size:14px}
.line{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:.8fr 1fr 1.2fr auto;gap:8px;align-items:end}
.line .des{grid-column:1/-1}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.totals .big{font:700 19px var(--display);color:var(--brand-deep)}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:38px;padding:0 12px;min-width:44px}
.seg button.on{background:var(--brand);color:#fff}
.seg button.on.A{background:var(--warn)}
.seg button.on.D{background:var(--amber)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#17233a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{min-height:36px;border-radius:20px;font-size:14px;white-space:nowrap}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
#rapFrame{position:fixed;left:0;right:0;top:calc(56px + env(safe-area-inset-top,0px));width:100%;height:calc(100vh - 114px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - 114px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:var(--bg);z-index:4}
.bars{display:flex;align-items:flex-end;gap:4px;padding-top:8px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bars i{display:block;width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.bars i.e{background:var(--ok);opacity:.75}
.bars small{font-size:10px;color:var(--muted)}
.bar2{display:flex;gap:2px;align-items:flex-end;width:100%;height:130px}
.bar2 i{flex:1}
.hbar{height:8px;border-radius:4px;background:var(--brand);margin-top:4px}
@media (max-width:370px){.grid{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <button id="back" class="small" aria-label="Retour" hidden>‹</button>
  <span class="mark" aria-hidden="true">SOGEI</span>
  <h1 id="title">Gestion</h1>
  <span id="hdrAct"></span>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Navigation"><div class="wrap">
  <a href="#/" data-tab="accueil"><span>🏠</span>Accueil</a>
  <a href="#/clients" data-tab="clients"><span>👥</span>Clients</a>
  <a href="#/interventions" data-tab="interventions"><span>🔧</span>Chantiers</a>
  <a href="#/docs" data-tab="docs"><span>🧾</span>Factures</a>
  <a href="#/plus" data-tab="plus"><span>☰</span>Plus</a>
</div></nav>
<div id="toast" role="status"></div>

<script src="assets.js"></script>
<script>
(function(){
'use strict';
/* =================== Données =================== */
const DEMO=/[?&]demo=1/.test(location.search);
const KEY=DEMO?'sogei-gestion-demo':'sogei-gestion-v1';
const DEF={
  settings:{societe:"Sté Générale d'Équipement Hydraulique et Électrique",mf:'',rc:'',tel:'74 427 522',gsm:'51 617 617',adresse:"Rue Ibn Badis, Avenue d'Algérie Sfax 3000",rib:'',tva:19,timbre:1,signataire:'KHALED GRAYRI',fonction:'Gérant',cachet:true,lastBackup:null},
  clients:[],interventions:[],docs:[],paiements:[],articles:[],mouvements:[],employes:[],pointage:{},avances:[],caisse:[]
};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const needDemo=DEMO&&(!S||typeof S!=='object');
if(!S||typeof S!=='object')S=JSON.parse(JSON.stringify(DEF));
for(const k in DEF){if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(DEF[k]))}
S.settings=Object.assign({},DEF.settings,S.settings);
// Client passager : toujours présent, non supprimable
const PASS='passager';
if(!S.clients.some(c=>c.id===PASS))S.clients.unshift({id:PASS,nom:'Client passager',tel:'',adresse:'',notes:'Client de passage (nom facultatif sur chaque chantier, devis ou facture)'});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Mémoire pleine : faites une sauvegarde')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ym=d=>String(d||'').slice(0,7);
const byId=(arr,id)=>S[arr].find(x=>x.id===id);
// Nom affiché : pour le client passager, le nom saisi sur le document s'il existe
function cName(o){const c=byId('clients',o.clientId);if(o.clientId==='passager'&&o.nomLibre)return o.nomLibre+' (passager)';return c?c.nom:'?'}
const sortC=(a,b)=>(b.id==='passager')-(a.id==='passager')||a.nom.localeCompare(b.nom);

/* =================== Outils =================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>{const n=parseFloat(String(x??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const r3=n=>Math.round(n*1000)/1000;
function dt(n,dec=3){const s=Math.abs(r3(n)).toFixed(dec),[i,d]=s.split('.');return (n<0?'−':'')+i.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(d?','+d:'')}
const DT=n=>dt(n)+' DT';
const frD=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''};
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const moisLabel=m=>{const [y,mo]=m.split('-');return MOIS[+mo-1]+' '+y};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function telLink(t){const d=String(t||'').replace(/\D/g,'');return d?'tel:'+(d.length===8?'+216'+d:d):''}
function waLink(t,msg){let d=String(t||'').replace(/\D/g,'');if(d.length===8)d='216'+d;if(d.startsWith('00'))d=d.slice(2);return d?'https://wa.me/'+d+(msg?'?text='+encodeURIComponent(msg):''):''}
function mapLink(c){const g=String(c.gps||'').trim();if(g)return /^https?:/.test(g)?g:'https://maps.google.com/?q='+encodeURIComponent(g);return c.adresse?'https://maps.google.com/?q='+encodeURIComponent(c.adresse):''}

/* Montant en lettres (dinars / millimes) */
function enLettres(n){
  const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
  const D={2:'vingt',3:'trente',4:'quarante',5:'cinquante',6:'soixante'};
  function lt100(n){
    if(n<17)return U[n];if(n<20)return 'dix-'+U[n-10];
    const d=Math.floor(n/10),u=n%10;
    if(d===7)return 'soixante'+(u===1?'-et-':'-')+lt100(10+u);
    if(d===9)return 'quatre-vingt-'+lt100(10+u);
    if(d===8)return 'quatre-vingt'+(u?'-'+U[u]:'s');
    return D[d]+(u===1?'-et-un':u?'-'+U[u]:'');
  }
  function lt1000(n){const c=Math.floor(n/100),r=n%100;let s='';if(c)s=(c>1?U[c]+'-cent':'cent')+(c>1&&!r?'s':'');if(r)s+=(s?'-':'')+lt100(r);return s||'zéro'}
  function full(n){
    if(n===0)return 'zéro';const parts=[];
    const mil=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000;
    if(mil)parts.push(lt1000(mil)+(mil>1?' millions':' million'));
    if(k)parts.push(k===1?'mille':lt1000(k).replace(/(cent|vingt)s$/,'$1')+'-mille');
    if(r)parts.push(lt1000(r));
    return parts.join(' ');
  }
  const t=Math.round(n*1000),di=Math.floor(t/1000),mi=t%1000;
  let s=full(di)+(di>1?' dinars':' dinar');
  if(mi)s+=' et '+full(mi)+(mi>1?' millimes':' millime');
  return s.charAt(0).toUpperCase()+s.slice(1);
}

/* =================== Calculs =================== */
function docTotals(d){
  const ht=r3((d.lignes||[]).reduce((a,l)=>a+num(l.qte)*num(l.pu),0));
  const remise=r3(ht*num(d.remise)/100);
  const base=r3(ht-remise);
  const tva=r3(base*num(d.tva)/100);
  const timbre=d.kind==='facture'?num(d.timbre):0;
  const ttc=r3(base+tva+timbre);
  return {ht,remise,base,tva,timbre,ttc};
}
const paye=d=>r3(S.paiements.filter(p=>p.docId===d.id).reduce((a,p)=>a+num(p.montant),0));
function docEtat(d){
  if(d.kind==='devis'){const m={brouillon:['Brouillon','grey'],envoye:['Envoyé','amber'],accepte:['Accepté','ok'],refuse:['Refusé','warn']};if(d.factureId)return ['Facturé','ok'];return m[d.statut||'brouillon']}
  const t=docTotals(d).ttc,p=paye(d);
  if(t>0&&p>=t-0.0005)return ['Payée','ok'];if(p>0)return ['Partielle','amber'];return ['Impayée','warn'];
}
const reste=d=>r3(docTotals(d).ttc-paye(d));
const stockOf=a=>r3(num(a.stock0)+S.mouvements.filter(m=>m.articleId===a.id).reduce((s,m)=>s+num(m.qte),0));
function nextNum(kind,date){
  const y=String(date||today()).slice(0,4),p=(kind==='devis'?'D':'F')+'-'+y+'-';
  const max=S.docs.filter(d=>d.kind===kind&&String(d.num||'').startsWith(p)).reduce((m,d)=>Math.max(m,parseInt(d.num.slice(p.length))||0),0);
  return p+String(max+1).padStart(3,'0');
}
// Sorties de stock d'une facture : recalculées à chaque enregistrement
function applyStock(d){
  S.mouvements=S.mouvements.filter(m=>m.docId!==d.id);
  if(d.kind!=='facture')return;
  (d.lignes||[]).forEach(l=>{if(l.articleId&&byId('articles',l.articleId)&&num(l.qte))S.mouvements.push({id:uid(),articleId:l.articleId,date:d.date,qte:-num(l.qte),motif:'Facture '+d.num,docId:d.id})});
}
// Journal de caisse = opérations saisies + paiements reçus + avances sur salaire
function journal(){
  const L=S.caisse.map(c=>({id:c.id,date:c.date,montant:c.sens==='-'?-num(c.montant):num(c.montant),lib:(c.categorie||'')+(c.note?' — '+c.note:''),src:'caisse'}));
  S.paiements.forEach(p=>{const d=byId('docs',p.docId),c=d&&byId('clients',d.clientId);L.push({id:p.id,date:p.date,montant:num(p.montant),lib:'Paiement '+(d?d.num:'')+(c?' — '+c.nom:'')+(p.mode?' ('+p.mode+')':''),src:'paiement',docId:p.docId})});
  S.avances.forEach(a=>{const e=byId('employes',a.empId);L.push({id:a.id,date:a.date,montant:-num(a.montant),lib:'Avance salaire — '+(e?e.nom:''),src:'avance'})});
  return L.sort((a,b)=>b.date.localeCompare(a.date));
}
function recapEmp(e,m){
  let P=0,D=0,A=0;
  Object.keys(S.pointage).filter(d=>d.startsWith(m)).forEach(d=>{const v=S.pointage[d][e.id];if(v==='P')P++;else if(v==='D')D++;else if(v==='A')A++});
  const jours=P+D/2;
  const du=e.type==='mois'?num(e.salaire):r3(jours*num(e.salaire));
  const av=r3(S.avances.filter(a=>a.empId===e.id&&a.date.startsWith(m)).reduce((s,a)=>s+num(a.montant),0));
  return {P,D,A,jours,du,av,net:r3(du-av)};
}

/* =================== Formulaires =================== */
// champ : {k,l,t:'text|tel|date|number|select|textarea|check',o:[[v,l]],full,ph,step}
function fields(spec,obj){
  return '<div class="grid">'+spec.map(f=>{
    const v=obj[f.k]??'',id='f_'+f.k,cls=f.full?' class="full"':'';
    if(f.t==='select')return `<label${cls}>${esc(f.l)}<select id="${id}">${f.o.map(([a,b])=>`<option value="${esc(a)}"${String(v)===String(a)?' selected':''}>${esc(b)}</option>`).join('')}</select></label>`;
    if(f.t==='textarea')return `<label class="full">${esc(f.l)}<textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></label>`;
    if(f.t==='check')return `<label class="full" style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="${id}" style="width:22px;min-height:22px"${v?' checked':''}> ${esc(f.l)}</label>`;
    const im=f.t==='number'?' inputmode="decimal"':'';
    const tp=f.t==='number'?'text':(f.t||'text');
    return `<label${cls}>${esc(f.l)}<input id="${id}" type="${tp}"${im} value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.list?` list="${f.list}"`:''} autocomplete="off"></label>`;
  }).join('')+'</div>';
}
function read(spec,obj){spec.forEach(f=>{const el=document.getElementById('f_'+f.k);if(!el)return;obj[f.k]=f.t==='check'?el.checked:el.value.trim()});return obj}
function passToggle(){const sel=$('#f_clientId');if(!sel)return;const up=()=>['f_nomLibre','f_telLibre'].forEach(k=>{const e=document.getElementById(k);if(e)e.closest('label').hidden=sel.value!=='passager'});sel.addEventListener('change',up);up()}
const clientOpts=()=>[['','— Choisir —'],...S.clients.slice().sort(sortC).map(c=>[c.id,c.id==='passager'?'🚶 '+c.nom:c.nom])];

/* =================== Rendu / routes =================== */
const V=$('#view');
function setHead(title,{back,act}={}){
  $('#title').textContent=title;document.title=title+' · SOGEI';
  const b=$('#back');b.hidden=!back;b.onclick=()=>{if(history.length>1)history.back();else location.hash=back};
  $('#hdrAct').innerHTML=act||'';
}
function tab(t){document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.tab===t))}
function confirmBtn(btn,fn){btn.onclick=()=>{if(btn.dataset.armed){fn();return}btn.dataset.armed=1;const o=btn.textContent;btn.textContent='Confirmer ?';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=o}},3000)}}
const go=h=>{location.hash=h};

const routes=[
  [/^#?\/?$/,accueil],
  [/^#\/clients$/,clients],[/^#\/client\/([\w-]+)$/,clientView],[/^#\/client-edit\/([\w-]+)$/,clientEdit],
  [/^#\/interventions$/,interventions],[/^#\/inter\/([\w-]+)$/,interEdit],
  [/^#\/docs$/,docs],[/^#\/doc\/([\w-]+)$/,docView],[/^#\/doc-edit\/([\w-]+)$/,docEdit],
  [/^#\/plus$/,plus],
  [/^#\/stock$/,stock],[/^#\/article\/([\w-]+)$/,articleEdit],
  [/^#\/equipe$/,equipe],[/^#\/employe\/([\w-]+)$/,employeEdit],[/^#\/pointage$/,pointage],[/^#\/paie$/,paie],
  [/^#\/caisse$/,caisse],[/^#\/bilan$/,bilan],[/^#\/rapport\/([\w-]+)$/,rapport],[/^#\/params$/,params]
];
function route(){
  const h=(location.hash||'#/').split('?')[0];
  clearInterval(rapTimer);if(!/^#\/rapport\//.test(h))rapLeave();
  for(const [re,fn] of routes){const m=re.exec(h);if(m){V.innerHTML='';scrollTo(0,0);fn(...m.slice(1));return}}
  go('#/');
}
addEventListener('hashchange',route);

/* ---------- Accueil ---------- */
function accueil(){
  tab('accueil');setHead('Tableau de bord');
  const m=ym(today());
  const fact=S.docs.filter(d=>d.kind==='facture');
  const caMois=r3(fact.filter(d=>ym(d.date)===m).reduce((a,d)=>a+docTotals(d).ttc,0));
  const encMois=r3(S.paiements.filter(p=>ym(p.date)===m).reduce((a,p)=>a+num(p.montant),0));
  const imp=fact.filter(d=>reste(d)>0.0005);
  const totImp=r3(imp.reduce((a,d)=>a+reste(d),0));
  const solde=r3(journal().reduce((a,j)=>a+j.montant,0));
  const actives=S.interventions.filter(i=>i.statut==='afaire'||i.statut==='encours').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const bas=S.articles.filter(a=>a.seuil!==''&&a.seuil!=null&&stockOf(a)<=num(a.seuil));
  const pt=S.pointage[today()]||{},actifs=S.employes.filter(e=>e.actif!==false),nonPointes=actifs.filter(e=>!pt[e.id]).length;
  const days=S.settings.lastBackup?Math.floor((Date.now()-new Date(S.settings.lastBackup))/864e5):null;
  let h='';
  if(DEMO)h+=`<div class="card" style="border-color:#f0b44c;background:color-mix(in srgb,#f0b44c 12%,var(--card))"><b>Mode démo — un an d’activité fictive</b><p class="hint">Novembre 2025 → novembre 2026. Tout est modifiable ici sans toucher à vos vraies données.</p><div class="row"><a class="btn small primary" href="./">Quitter la démo</a><button class="small" id="demoReset">Remettre la démo à zéro</button></div></div>`;
  if(!DEMO&&S.clients.length+S.docs.length>0&&(days===null||days>=7))h+=`<div class="card" style="border-color:var(--amber)"><div class="row"><span class="grow">💾 ${days===null?'Aucune sauvegarde faite.':'Dernière sauvegarde il y a '+days+' jours.'} Les données sont seulement sur ce téléphone.</span><a class="btn small primary" href="#/params">Sauvegarder</a></div></div>`;
  h+=`<div class="kpis">
    <a class="kpi" href="#/docs"><small>Facturé en ${MOIS[+m.slice(5)-1]}</small><b class="money">${dt(caMois)}</b><small>DT TTC</small></a>
    <a class="kpi" href="#/caisse"><small>Encaissé en ${MOIS[+m.slice(5)-1]}</small><b class="money">${dt(encMois)}</b><small>DT</small></a>
    <a class="kpi${totImp>0?' warn':''}" href="#/docs?f=impayees"><small>Reste à encaisser</small><b class="money">${dt(totImp)}</b><small>${imp.length} facture${imp.length>1?'s':''}</small></a>
    <a class="kpi" href="#/caisse"><small>Solde caisse</small><b class="money">${dt(solde)}</b><small>DT</small></a>
  </div>`;
  h+=`<a class="btn" href="#/bilan">📊 Bilan des 12 derniers mois</a>`;
  h+=`<div class="row"><a class="btn primary grow" href="#/inter/new">+ Chantier</a><a class="btn grow" href="#/doc-edit/new?k=devis">+ Devis</a><a class="btn grow" href="#/doc-edit/new?k=facture">+ Facture</a></div>`;
  if(actifs.length)h+=`<a class="card" href="#/pointage" style="text-decoration:none;color:inherit"><div class="row"><span class="grow">🕘 Pointage du jour</span>${nonPointes?`<span class="tag amber">${nonPointes} à pointer</span>`:'<span class="tag ok">Fait</span>'}</div></a>`;
  h+=`<div class="card"><h2>Chantiers en cours <a class="tag" href="#/interventions">Tout voir</a></h2><div class="list">${actives.slice(0,6).map(interItem).join('')||'<div class="empty">Aucun chantier en cours.</div>'}</div></div>`;
  if(imp.length)h+=`<div class="card"><h2>Factures impayées</h2><div class="list">${imp.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6).map(docItem).join('')}</div></div>`;
  if(bas.length)h+=`<div class="card"><h2>Stock bas</h2><div class="list">${bas.map(artItem).join('')}</div></div>`;
  if(!S.clients.length)h+=`<div class="card"><h2>Bienvenue</h2><p class="hint">Commencez par compléter les informations de la société (matricule fiscal) dans <a href="#/params">Paramètres</a>, puis ajoutez vos salariés, vos articles en stock et vos clients.</p></div>`;
  V.innerHTML=h;
  if($('#demoReset'))confirmBtn($('#demoReset'),()=>{localStorage.removeItem(KEY);location.reload()});
}

/* ---------- Clients ---------- */
function clientItem(c){
  const ds=S.docs.filter(d=>d.kind==='facture'&&d.clientId===c.id),r=r3(ds.reduce((a,d)=>a+reste(d),0));
  return `<a class="item" href="#/client/${c.id}"><div class="t"><b>${esc(c.nom)}</b><small>${esc([c.tel,c.adresse].filter(Boolean).join(' · '))||'—'}</small></div>${r>0?`<div class="r" style="color:var(--warn)">${dt(r)}<small>dû</small></div>`:''}</a>`;
}
function clients(){
  tab('clients');setHead('Clients',{act:'<button class="small" onclick="location.hash=\'#/client-edit/new\'">+ Nouveau</button>'});
  V.innerHTML=`<input id="q" type="search" placeholder="Rechercher un client, un téléphone…"><div class="card"><div class="list" id="L"></div></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();const L=S.clients.filter(c=>(c.nom+' '+c.tel+' '+c.adresse).toLowerCase().includes(q)).sort(sortC);$('#L').innerHTML=L.map(clientItem).join('')||`<div class="empty">${S.clients.length?'Aucun résultat.':'Aucun client. Touchez « + Nouveau ».'}</div>`};
  $('#q').oninput=draw;draw();
}
const CLIENT_F=[{k:'nom',l:'Nom / raison sociale',full:1},{k:'tel',l:'Téléphone',t:'tel'},{k:'tel2',l:'Autre téléphone',t:'tel'},{k:'adresse',l:'Adresse / localité',full:1},{k:'gps',l:'Position GPS ou lien Maps',full:1,ph:'34.74, 10.76'},{k:'mf',l:'Matricule fiscal (si société)',full:1},{k:'notes',l:'Notes',t:'textarea'}];
function clientEdit(id){
  tab('clients');const isNew=id==='new';const c=isNew?{id:uid()}:Object.assign({},byId('clients',id));
  if(!isNew&&!c.nom)return go('#/clients');
  setHead(isNew?'Nouveau client':'Modifier client',{back:'#/clients'});
  V.innerHTML=`<div class="card">${fields(CLIENT_F,c)}<button class="ghost small" id="gpsBtn" style="align-self:flex-start">📍 Position actuelle</button></div>
  <div class="row"><button class="primary grow" id="ok">Enregistrer</button>${isNew?'':'<button class="danger" id="del">Supprimer</button>'}</div>`;
  $('#gpsBtn').onclick=()=>{if(!navigator.geolocation)return toast('GPS indisponible');toast('Recherche de la position…');navigator.geolocation.getCurrentPosition(p=>{$('#f_gps').value=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);toast('Position ajoutée')},()=>toast('Position refusée ou introuvable'),{enableHighAccuracy:true,timeout:15000})};
  $('#ok').onclick=()=>{read(CLIENT_F,c);if(!c.nom)return toast('Le nom est obligatoire');
    const i=S.clients.findIndex(x=>x.id===c.id);if(i<0)S.clients.push(c);else S.clients[i]=c;save();toast('Client enregistré');
    const back=new URLSearchParams(location.hash.split('?')[1]||'').get('back');
    if(back){sessionStorage.setItem('newClient',c.id);history.back()}else location.replace('#/client/'+c.id)};
  if(!isNew&&id==='passager')$('#del').remove();
  else if(!isNew){const d=$('#del');const used=S.interventions.some(x=>x.clientId===id)||S.docs.some(x=>x.clientId===id);
    if(used){d.onclick=()=>toast('Client utilisé dans des chantiers ou factures : suppression impossible')}else confirmBtn(d,()=>{S.clients=S.clients.filter(x=>x.id!==id);save();go('#/clients')})}
}
function clientView(id){
  tab('clients');const c=byId('clients',id);if(!c)return go('#/clients');
  setHead(c.nom,{back:'#/clients',act:`<button class="small" onclick="location.hash='#/client-edit/${id}'">Modifier</button>`});
  const inter=S.interventions.filter(i=>i.clientId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const ds=S.docs.filter(d=>d.clientId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const du=r3(ds.filter(d=>d.kind==='facture').reduce((a,d)=>a+reste(d),0));
  const ml=mapLink(c);
  V.innerHTML=`<div class="card">
    ${c.tel?`<div class="row"><a class="btn grow" href="${telLink(c.tel)}">📞 Appeler</a><a class="btn grow" href="${waLink(c.tel)}" target="_blank" rel="noopener">💬 WhatsApp</a>${ml?`<a class="btn grow" href="${esc(ml)}" target="_blank" rel="noopener">📍 Carte</a>`:''}</div>`:''}
    <p class="hint">${esc([c.tel,c.tel2].filter(Boolean).join(' / '))}${c.adresse?'<br>'+esc(c.adresse):''}${c.mf?'<br>MF : '+esc(c.mf):''}</p>
    ${c.notes?`<p style="margin:0;white-space:pre-wrap">${esc(c.notes)}</p>`:''}
    ${du>0?`<p style="margin:0;color:var(--warn);font-weight:600">Reste dû : ${DT(du)}</p>`:''}

}

/* ---------- Interventions ---------- */
const TYPES=[['essai','Essai de débit'],['installation','Installation pompe'],['reparation','Réparation / dépannage'],['rebobinage','Rebobinage moteur'],['entretien','Entretien'],['traitement','Traitement des eaux'],['autre','Autre']];
const STATUTS=[['afaire','À faire','amber'],['encours','En cours','tag'],['termine','Terminé','ok'],['annule','Annulé','grey']];
const typeL=k=>(TYPES.find(t=>t[0]===k)||[,k||''])[1];
const statT=k=>{const s=STATUTS.find(t=>t[0]===k)||STATUTS[0];return `<span class="tag ${s[2]==='tag'?'':s[2]}">${s[1]}</span>`};
function interItem(i){const c=byId('clients',i.clientId);const f=i.factureId&&byId('docs',i.factureId);
  return `<a class="item" href="#/inter/${i.id}"><div class="t"><b>${esc(typeL(i.type))} — ${esc(cName(i))}</b><small>${frD(i.date)}${i.lieu?' · '+esc(i.lieu):''}${(i.employes||[]).length?' · '+esc(i.employes.map(e=>(byId('employes',e)||{}).nom).filter(Boolean).join(', ')):''}</small></div><div class="r">${f?'<span class="tag ok">Facturé</span>':statT(i.statut)}${rapFait(i)?'<small>📄 rapport</small>':''}</div></a>`}
let interFilter='actives';
function interventions(){
  tab('interventions');setHead('Chantiers',{act:'<button class="small" onclick="location.hash=\'#/inter/new\'">+ Nouveau</button>'});
  const F=[['actives','En cours / à faire'],['afacturer','À facturer'],['tout','Tout']];
  V.innerHTML=`<div class="chips">${F.map(([k,l])=>`<button data-f="${k}" class="${interFilter===k?'on':''}">${l}</button>`).join('')}</div><input id="q" type="search" placeholder="Rechercher…"><div class="card"><div class="list" id="L"></div></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();
    let L=S.interventions.filter(i=>{if(interFilter==='actives')return i.statut==='afaire'||i.statut==='encours';if(interFilter==='afacturer')return i.statut==='termine'&&!i.factureId;return true});
    L=L.filter(i=>{return (cName(i)+' '+typeL(i.type)+' '+(i.lieu||'')+' '+(i.description||'')).toLowerCase().includes(q)});
    L.sort((a,b)=>interFilter==='actives'?(a.date||'').localeCompare(b.date||''):(b.date||'').localeCompare(a.date||''));
    $('#L').innerHTML=L.map(interItem).join('')||'<div class="empty">Aucune intervention.</div>'};
  V.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{interFilter=b.dataset.f;interventions()});
  $('#q').oninput=draw;draw();
}

  ${isNew?'':`<div class="card"><h2>Suite</h2>
    <a class="btn${i.type==='essai'?' primary':''}" href="#/rapport/${i.id}">📄 Rapport d'essai de débit${rapFait(i)?' ✓':''}</a>
    ${f?`<a class="btn" href="#/doc/${f.id}">🧾 Voir la facture ${esc(f.num)}</a>`:`<div class="row"><button class="grow" id="mkDevis">Faire un devis</button><button class="grow primary" id="mkFact">Facturer</button></div>`}
  </div>`}
  <div class="row"><button class="primary grow" id="ok">Enregistrer</button>${isNew?'':'<button class="danger" id="del">Supprimer</button>'}</div>`;

  $('#newC').onclick=()=>{collect();sessionStorage.setItem('interDraft',JSON.stringify(Object.assign({},i,{id:undefined})));go('#/client-edit/new?back=1')};
  const store=()=>{collect();if(!i.clientId){toast('Choisissez un client');return false}const k=S.interventions.findIndex(x=>x.id===i.id);if(k<0)S.interventions.push(i);else S.interventions[k]=i;save();return true};
  $('#ok').onclick=()=>{if(store()){toast('Intervention enregistrée');location.replace('#/interventions')}};
  if(!isNew){
    confirmBtn($('#del'),()=>{S.interventions=S.interventions.filter(x=>x.id!==i.id);save();go('#/interventions')});
    const mk=k=>()=>{if(store())go('#/doc-edit/new?k='+k+'&c='+i.clientId+'&i='+i.id)};
    if($('#mkDevis'))$('#mkDevis').onclick=mk('devis');if($('#mkFact'))$('#mkFact').onclick=mk('facture');
  }
}

/* ---------- Devis / factures ---------- */
function docItem(d){const c=byId('clients',d.clientId),[l,cl]=docEtat(d),t=docTotals(d).ttc,r=d.kind==='facture'?reste(d):0;
  return `<a class="item" href="#/doc/${d.id}"><div class="t"><b>${esc(d.num)} — ${esc(cName(d))}</b><small>${d.kind==='devis'?'Devis':'Facture'} du ${frD(d.date)}</small></div><div class="r money">${dt(t)}<small><span class="tag ${cl}">${l}</span>${r>0.0005&&r<t-0.0005?' '+dt(r):''}</small></div></a>`}
let docFilter='factures';
function docs(){
  tab('docs');
  const qs=new URLSearchParams(location.hash.split('?')[1]||'');if(qs.get('f'))docFilter=qs.get('f');
  setHead('Devis & factures',{act:'<button class="small" onclick="location.hash=\'#/doc-edit/new?k=facture\'">+ Facture</button>'});
  const F=[['factures','Factures'],['impayees','Impayées'],['devis','Devis']];
  V.innerHTML=`<div class="chips">${F.map(([k,l])=>`<button data-f="${k}" class="${docFilter===k?'on':''}">${l}</button>`).join('')}<button onclick="location.hash='#/doc-edit/new?k=devis'">+ Devis</button></div><input id="q" type="search" placeholder="Numéro, client…"><div class="card"><div class="list" id="L"></div><p class="hint" id="T"></p></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();

  $('#q').oninput=draw;draw();
}

  passToggle();

/* ---------- PDF (modèle SOGEI) ---------- */
let ASSETS=null;
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const safe=s=>String(s??'').replace(/[‘’]/g,"’").replace(/[−–—]/g,'-').replace(/[^\x20-\x7e\xa0-ÿ’€]/g,'');
async function docPdf(d){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  if(!ASSETS)ASSETS={tpl:b64(SOGEI_ASSETS.MODELE_B64),cachet:b64(SOGEI_ASSETS.CACHET_B64)};
  const st=S.settings,c=byId('clients',d.clientId)||{},t=docTotals(d),isF=d.kind==='facture';
  const doc=await PDFDocument.create();
  doc.setTitle((isF?'Facture ':'Devis ')+d.num);doc.setAuthor('SOGEI');
  const [bg]=await doc.embedPdf(ASSETS.tpl.slice(0),[0]);const H=bg.height,W=bg.width;
  const reg=await doc.embedFont(StandardFonts.Helvetica),bold=await doc.embedFont(StandardFonts.HelveticaBold);
  const ink=rgb(.133,.133,.133),black=rgb(0,0,0),blue=rgb(0x2f/255,0x54/255,0x96/255),white=rgb(1,1,1),grey=rgb(.955,.96,.97),rule=rgb(.82,.84,.88),light=rgb(.92,.945,.985);
  const XL=99,XR=548,TOP=140,BOTTOM=740;
  let page,y;
  const newPage=()=>{page=doc.addPage([W,H]);page.drawPage(bg,{x:0,y:0,width:W,height:H});y=TOP};
  const text=(s,x,yy,f,sz,col)=>page.drawText(safe(s),{x,y:H-yy,size:sz,font:f,color:col||ink});
  const rtext=(s,x,yy,f,sz,col)=>text(s,x-f.widthOfTextAtSize(safe(s),sz),yy,f,sz,col);
  const rect=(x,yt,w,h,o)=>page.drawRectangle(Object.assign({x,y:H-(yt+h),width:w,height:h},o));
  const wrap=(s,f,sz,max)=>{const out=[];String(s||'').split(/\n/).forEach(par=>{let line='';safe(par).split(/\s+/).filter(Boolean).forEach(w=>{const tt=line?line+' '+w:w;if(f.widthOfTextAtSize(tt,sz)>max&&line){out.push(line);line=w}else line=tt});out.push(line)});return out};
  newPage();
  // Titre
  const title=(isF?'FACTURE':'DEVIS')+' N° '+d.num;
  const tw=bold.widthOfTextAtSize(safe(title),20);text(title,(XL+XR)/2-tw/2,150,bold,20,black);
  y=172;
  // Bloc société (gauche) / client (droite)
  const leftL=[st.mf?'MF : '+st.mf:'',st.rc?'RC : '+st.rc:'','Date : '+frD(d.date),isF&&d.echeance?'Échéance : '+frD(d.echeance):'',!isF&&d.validite?'Validité : '+d.validite+' jours':''].filter(Boolean);
  const isP=d.clientId==='passager';const cl=(isP?[d.nomLibre||'Client passager',d.telLibre?'Tél : '+d.telLibre:'']:[c.nom||'',c.adresse||'',c.tel?'Tél : '+c.tel:'',c.mf?'MF : '+c.mf:'']).filter(Boolean);
  const bx=330,bw=XR-bx,bh=18+cl.length*14;
  rect(bx,y,bw,bh,{borderColor:blue,borderWidth:.9});
  text('CLIENT',bx+8,y+12,bold,9,blue);
  cl.forEach((s,k)=>text(s,bx+8,y+26+k*14,k===0?bold:reg,k===0?11:10,black));
  leftL.forEach((s,k)=>text(s,XL,y+12+k*15,reg,10.5,blue));
  y+=Math.max(bh,leftL.length*15)+18;
  // Tableau des lignes
  const cQ=380,cPU=460,cT=XR-6,RH=20;
  const headRow=()=>{rect(XL,y,XR-XL,20,{color:blue});text('Désignation',XL+6,y+14,bold,10,white);rtext('Qté',cQ+18,y+14,bold,10,white);rtext('P.U. HT',cPU+20,y+14,bold,10,white);rtext('Total HT',cT,y+14,bold,10,white);y+=20};
  headRow();
  d.lignes.forEach((l,k)=>{
    const ls=wrap(l.des,reg,10,cQ-XL-30),h=Math.max(RH,8+ls.length*12);
    if(y+h>BOTTOM){newPage();headRow()}
    if(k%2===1)rect(XL,y,XR-XL,h,{color:grey});
    ls.forEach((s,j)=>text(s,XL+6,y+14+j*12,reg,10,ink));
    rtext(String(l.qte).replace('.',','),cQ+18,y+14,reg,10,ink);
    rtext(dt(num(l.pu)),cPU+20,y+14,reg,10,ink);
    rtext(dt(num(l.qte)*num(l.pu)),cT,y+14,bold,10,black);
    y+=h;page.drawLine({start:{x:XL,y:H-y},end:{x:XR,y:H-y},thickness:.6,color:rule});
  });
  y+=10;
  // Totaux
  const TL=[['Total HT',t.ht]];
  if(t.remise)TL.push(['Remise '+String(d.remise).replace('.',',')+' %',-t.remise],['Net HT',t.base]);
  TL.push(['TVA '+String(d.tva).replace('.',',')+' %',t.tva]);if(isF)TL.push(['Timbre fiscal',t.timbre]);
  const totH=TL.length*17+26;
  if(y+totH+50>BOTTOM)newPage();
  const tx=330;
  TL.forEach(([l,v])=>{text(l,tx+8,y+12,reg,10.5,ink);rtext(DT(v),cT,y+12,reg,10.5,black);y+=17});
  rect(tx,y,XR-tx,24,{color:light,borderColor:blue,borderWidth:1});
  text('Total TTC',tx+8,y+16,bold,12,blue);rtext(DT(t.ttc),cT,y+16,bold,12,blue);
  y+=36;
  // Montant en lettres
  const words=wrap((isF?'Arrêtée la présente facture à la somme de : ':'Arrêté le présent devis à la somme de : ')+enLettres(t.ttc)+'.',reg,10,XR-XL);
  words.forEach((s,k)=>{if(y>BOTTOM)newPage();text(s,XL,y+k*13,k===0?reg:reg,10,ink)});y+=words.length*13+6;
  if(d.notes){wrap(d.notes,reg,10,XR-XL).forEach(s=>{if(y>BOTTOM)newPage();text(s,XL,y,reg,10,ink);y+=13})}
  if(st.rib){if(y>BOTTOM)newPage();text('RIB : '+st.rib,XL,y,reg,10,ink);y+=13}
  // Signature
  const sigH=st.cachet!==false?120:45;
  if(y+20+sigH>760)newPage();
  let sy=y+22;const SX=448;
  ["Sté Générale d'Équipement","Hydraulique et Électrique",st.signataire,st.fonction].forEach(s=>{if(!s)return;const w=bold.widthOfTextAtSize(safe(s),11);text(s,SX-w/2,sy,bold,11,black);sy+=14});
  if(st.cachet!==false){const img=await doc.embedJpg(ASSETS.cachet.slice(0));const w=80,h=w*img.height/img.width;page.drawImage(img,{x:SX+5-w/2,y:H-(sy-4+h),width:w,height:h})}
  // Numéro de page
  const pages=doc.getPages();if(pages.length>1)pages.forEach((p,k)=>p.drawText((k+1)+' / '+pages.length,{x:XR-20,y:H-775,size:8,font:reg,color:ink}));
  return doc.save();
}
function pdfName(d){const c=byId('clients',d.clientId)||{};const n=String(d.clientId==='passager'?(d.nomLibre||'passager'):(c.nom||'')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');return (d.kind==='facture'?'Facture_':'Devis_')+d.num+(n?'_'+n:'')+'.pdf'}
async function shareBlob(blob,name,title){
  let file=null;try{file=new File([blob],name,{type:blob.type})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title});return 'shared'}catch(e){if(e&&e.name==='AbortError')return 'abort'}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);return 'download';
}
async function sharePdf(d){
  try{toast('Création du PDF…');const b=await docPdf(d);const r=await shareBlob(new Blob([b],{type:'application/pdf'}),pdfName(d),pdfName(d));
    if(r!=='abort'){if(d.kind==='devis'&&(d.statut||'brouillon')==='brouillon'){d.statut='envoye';save()}toast(r==='shared'?'PDF partagé':'PDF téléchargé')}}
  catch(e){console.error(e);toast('Erreur PDF : '+e.message)}
}

/* ---------- Rapport d'essai (même appli, rapport par chantier) ---------- */
const RKEY='sogei-rapport-v1';
let rapTimer=null;
const rapFait=i=>!!(i&&i.rapport&&(i.rapport.forages||[]).some(f=>f.profondeur||f.statique||f.debitTest));
const blankForage=()=>({nom:'FORAGE 01',profondeur:'',diametre:'200',statique:'',dynamique:'',puissance:'',tension:'',immersion:'',debitTest:'',rabattement:'',tempsInit:'',debitPropose:'',profPropose:'',puisConseil:'',tensConseil:'',observations:''});
// Enregistre ce qui est dans le rapport ouvert vers son propriétaire (chantier ou rapport libre)
function rapCapture(){
  const ctx=S.rapportCtx;if(!ctx)return;
  let r=null;try{r=JSON.parse(localStorage.getItem(RKEY))}catch(e){}
  if(!r)return;
  if(ctx==='libre')S.rapportLibre=r;else{const i=byId('interventions',ctx);if(i)i.rapport=r}
  save();
}
// En quittant un rapport : on l'enregistre, puis on remet le rapport libre en place
function rapLeave(){
  if(!S.rapportCtx)return;rapCapture();
  if(DEMO){const r=localStorage.getItem(RKEY+'-real');if(r)localStorage.setItem(RKEY,r);else localStorage.removeItem(RKEY);localStorage.removeItem(RKEY+'-real')}
  else if(S.rapportCtx!=='libre'){try{if(S.rapportLibre)localStorage.setItem(RKEY,JSON.stringify(S.rapportLibre));else localStorage.removeItem(RKEY)}catch(e){}}
  S.rapportCtx=null;save();
}
function rapport(id){
  const inter=id==='libre'?null:byId('interventions',id);
  if(id!=='libre'&&!inter)return go('#/interventions');
  tab(inter?'interventions':'plus');
  setHead(inter?'Rapport — '+cName(inter):"Rapport d'essai",{back:inter?'#/inter/'+id:'#/plus'});
  if(DEMO&&localStorage.getItem(RKEY+'-real')===null)localStorage.setItem(RKEY+'-real',localStorage.getItem(RKEY)||'');
  rapCapture();
  let data;
  if(inter){
    data=inter.rapport;
    if(!data){const c=byId('clients',inter.clientId)||{},isP=inter.clientId==='passager';
      data={adresse:[inter.lieu,isP?'':c.adresse].filter(Boolean).join(', '),client:isP?(inter.nomLibre||''):(c.nom||''),contact:isP?(inter.telLibre||''):(c.tel||''),date:inter.date||today(),
        signataire:S.settings.signataire,fonction:S.settings.fonction,cachet:S.settings.cachet!==false,forages:[blankForage()]};}
  }else{
    data=S.rapportLibre||(()=>{try{return JSON.parse(localStorage.getItem(RKEY))}catch(e){return null}})()||{date:today(),signataire:S.settings.signataire,fonction:S.settings.fonction,cachet:true,forages:[blankForage()]};
  }
  try{localStorage.setItem(RKEY,JSON.stringify(data))}catch(e){}
  S.rapportCtx=id;save();
  V.innerHTML='<iframe id="rapFrame" title="Rapport d\'essai de débit" src="../?embed=1" allow="web-share; clipboard-write"></iframe>';
  rapTimer=setInterval(rapCapture,3000);
}

/* ---------- Bilan 12 mois ---------- */
function bilan(){
  tab('plus');setHead('Bilan 12 mois',{back:'#/plus'});
  const now=new Date(today()+'T12:00:00'),M=[];
  for(let k=11;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);M.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  const fact=S.docs.filter(d=>d.kind==='facture'&&ym(d.date)>=M[0]);
  const ca=M.map(m=>r3(fact.filter(d=>ym(d.date)===m).reduce((a,d)=>a+docTotals(d).ttc,0)));
  const enc=M.map(m=>r3(S.paiements.filter(p=>ym(p.date)===m).reduce((a,p)=>a+num(p.montant),0)));
  const dep=M.map(m=>r3(-journal().filter(j=>ym(j.date)===m&&j.montant<0&&!/^Dépôt banque/.test(j.lib)).reduce((a,j)=>a+j.montant,0)));
  const max=Math.max(1,...ca,...enc);
  const T=ca.reduce((a,b)=>a+b,0),E=enc.reduce((a,b)=>a+b,0),Dp=dep.reduce((a,b)=>a+b,0);
  const byC={};fact.forEach(d=>{const k=d.clientId==='passager'?'passager':d.clientId;byC[k]=(byC[k]||0)+docTotals(d).ttc});
  const passT=byC.passager||0;delete byC.passager;const top=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,8),tmax=top.length?top[0][1]:1;
  const inter=S.interventions.filter(i=>ym(i.date)>=M[0]&&i.statut!=='annule');
  const byT=TYPES.map(([k,l])=>[l,inter.filter(i=>i.type===k).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const dv=S.docs.filter(d=>d.kind==='devis'&&ym(d.date)>=M[0]),dvOk=dv.filter(d=>d.factureId||d.statut==='accepte').length;
  const ML=m=>MOIS[+m.slice(5)-1].slice(0,3);
  V.innerHTML=`<div class="kpis">
    <div class="kpi"><small>Facturé (12 mois)</small><b class="money">${dt(T,0)}</b><small>DT TTC</small></div>
    <div class="kpi"><small>Encaissé (12 mois)</small><b class="money">${dt(E,0)}</b><small>DT</small></div>
    <div class="kpi"><small>Dépenses de caisse</small><b class="money">${dt(Dp,0)}</b><small>DT (salaires, achats…)</small></div>
    <div class="kpi"><small>Chantiers réalisés</small><b>${inter.length}</b><small>${fact.length} factures</small></div>
  </div>
  <div class="card"><h2>Chiffre d’affaires par mois</h2>
    <div class="bars">${M.map((m,k)=>`<div title="${moisLabel(m)} : ${dt(ca[k],0)} DT facturé, ${dt(enc[k],0)} DT encaissé"><div class="bar2"><i style="height:${ca[k]/max*100}%"></i><i class="e" style="height:${enc[k]/max*100}%"></i></div><small>${ML(m)}</small></div>`).join('')}</div>
    <p class="hint"><span style="color:var(--brand)">■</span> facturé · <span style="color:var(--ok)">■</span> encaissé</p>
    <div class="list">${M.map((m,k)=>`<div class="item" style="min-height:0;padding:7px 2px"><div class="t"><b>${moisLabel(m)}</b></div><div class="r money">${dt(ca[k],0)}<small style="color:var(--ok)">${dt(enc[k],0)} encaissé</small></div></div>`).reverse().join('')}</div>
  </div>
  <div class="card"><h2>Meilleurs clients</h2><div class="list">${top.map(([id,v])=>{const c=byId('clients',id);return `<a class="item" href="#/client/${id}" style="display:block"><div class="row"><b class="grow" style="font-weight:600">${esc(c?c.nom:'?')}</b><span class="money">${dt(v,0)} DT</span></div><div class="hbar" style="width:${v/tmax*100}%"></div></a>`}).join('')||'<div class="empty">Aucune facture.</div>'}</div>${passT?`<p class="hint">Clients passagers (total) : ${dt(passT,0)} DT</p>`:''}</div>
  <div class="card"><h2>Types de travaux</h2><div class="list">${byT.map(([l,n])=>`<div class="item" style="min-height:0;padding:8px 2px"><div class="t"><b>${esc(l)}</b></div><div class="r">${n}</div></div>`).join('')}</div>
  <p class="hint">Devis : ${dv.length} envoyés, ${dvOk} acceptés (${dv.length?Math.round(dvOk/dv.length*100):0} %).</p></div>`;
}

  <label>Restaurer une sauvegarde<input type="file" id="rs" accept=".json,application/json"></label></div>
  <div class="card"><h2>Données</h2><p class="hint">${S.clients.length} clients · ${S.interventions.length} interventions · ${S.docs.length} devis/factures · ${S.articles.length} articles · ${S.employes.length} salariés</p><button class="danger" id="wipe">Tout effacer</button></div>`;
  $('#ok').onclick=()=>{read(PAR_F,st);save();toast('Paramètres enregistrés')};
  $('#bk').onclick=async()=>{const name='SOGEI_sauvegarde_'+today()+'.json';const r=await shareBlob(new Blob([JSON.stringify(S)],{type:'application/json'}),name,name);if(r!=='abort'){S.settings.lastBackup=new Date().toISOString();save();toast('Sauvegarde faite');params()}};
  $('#rs').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o||!Array.isArray(o.clients)||!o.settings)throw new Error('format');
      if(!confirm('Remplacer toutes les données de ce téléphone par cette sauvegarde ?'))return;S=o;for(const k in DEF)if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(DEF[k]));save();toast('Sauvegarde restaurée');go('#/')}catch(err){toast('Fichier de sauvegarde invalide')}};
  confirmBtn($('#wipe'),()=>{S=JSON.parse(JSON.stringify(DEF));save();toast('Données effacées');go('#/')});
}
